}

function ZieleView({ trainer, produkte, verfuegbarkeit, ziele, setZiele, erfolge, beratungen }) {
  const [edit, setEdit] = useState(null);
  const [form, setForm] = useState({ sparte: "trainer", produkt_id: "", produkt_name: "", ziel_anzahl: 5, zeitraum_von: "", zeitraum_bis: "" });
  const [busy, setBusy] = useState(false);
  const istBeratungsBerechtigt = darfBeratung(trainer);
  const studioZiele = ziele.filter(function(z) { return z.studio === trainer.studio; });
  const studioProdukte = getStudioProdukte(produkte, verfuegbarkeit, trainer.studio);
  const today = ymdLokal(new Date());

  // Berater-Optionen: Sammel-Buckets + Fitness-Park-Sammelwert + jede einzelne Mitgliedschaft.
  const beraterOptionen = [].concat(
    [
      { key: "Alle Abschlüsse", label: "Alle Abschlüsse" },
      { key: "Alle Gespräche", label: "Alle Gespräche (inkl. ohne Abschluss)" },
      { key: "Fitness Park Mitgliedschaft", label: "Fitness Park Mitgliedschaft (1 + 12 + 24 Monate)" }
    ],
    BERATUNG_MITGLIEDSCHAFTEN.map(function(m) { return { key: m, label: m }; })
  );

  const startAdd = function() {
    var mon = new Date();
    // Default: aktueller Monat (1. bis letzter Tag).
    var monStart = ymdLokal(new Date(mon.getFullYear(), mon.getMonth(), 1));
    var monEnde = ymdLokal(new Date(mon.getFullYear(), mon.getMonth() + 1, 0));
    setForm({ sparte: "trainer", produkt_id: "", produkt_name: "", ziel_anzahl: 5, zeitraum_von: monStart, zeitraum_bis: monEnde });
    setEdit("new");
  };

  const save = async function() {
    if (!form.produkt_name || !form.zeitraum_von || !form.zeitraum_bis) { alert("Bitte alle Felder ausfüllen."); return; }
    if (!form.ziel_anzahl || form.ziel_anzahl < 1) { alert("Ziel-Anzahl muss mindestens 1 sein."); return; }
    setBusy(true);
    var nz = { studio: trainer.studio, sparte: form.sparte, produkt_id: form.produkt_id || null, produkt_name: form.produkt_name, ziel_anzahl: form.ziel_anzahl, zeitraum_von: form.zeitraum_von, zeitraum_bis: form.zeitraum_bis, erstellt_von: trainer.name };
    var res = await sb.from("ziele").insert([nz]).select().single();
    setBusy(false);
    if (res.error) { alert("Fehler: " + res.error.message); return; }
    setZiele(function(prev) { return prev.concat([res.data || nz]); });
    setEdit(null);
  };

  const del = async function(id) {
    if (!confirm("Ziel wirklich löschen?")) return;
    await sb.from("ziele").delete().eq("id", id);
    setZiele(function(prev) { return prev.filter(function(z) { return z.id !== id; }); });
  };

  // Fortschritt je Sparte
  const getProgress = function(z) {
    if (z.sparte === "berater") {
      var basis = beratungen.filter(function(b) {
        if (b.studio !== trainer.studio) return false;
        var d = new Date(b.datum); var von = new Date(z.zeitraum_von + "T00:00:00"); var bis = new Date(z.zeitraum_bis + "T23:59:59.999");
        if (d < von || d > bis) return false;
        return true;
      });
      if (z.produkt_name === "Alle Gespräche") return basis.length;
      if (z.produkt_name === "Alle Abschlüsse") return basis.filter(function(b) { return b.abschluss; }).length;
      // Fitness Park Mitgliedschaft = Abschlüsse mit 1, 12 oder 24 Monaten (je Abschluss max. 1 gezählt).
      if (z.produkt_name === "Fitness Park Mitgliedschaft") {
        return basis.filter(function(b) {
          return b.abschluss && (b.mitgliedschaften || []).some(function(m) { return BERATUNG_FITNESSPARK.includes(m); });
        }).length;
      }
      // Mitgliedschaft: Anzahl Abschlüsse die diese Mitgliedschaft enthalten
      return basis.filter(function(b) { return b.abschluss && (b.mitgliedschaften || []).includes(z.produkt_name); }).length;
    }
    // Default: Trainer (alte Logik)
    return erfolge.filter(function(e) {
      if (e.studio !== trainer.studio) return false;
      var d = new Date(e.datum); var von = new Date(z.zeitraum_von + "T00:00:00"); var bis = new Date(z.zeitraum_bis + "T23:59:59.999");
      if (d < von || d > bis) return false;
      if (!z.produkt_id) return true;
      return (e.verkauft || []).some(function(v) { return (v.id || v) === z.produkt_id; });
    }).reduce(function(sum, e) {
      if (!z.produkt_id) return sum + (e.verkauft || []).length;
      return sum + (e.verkauft || []).filter(function(v) { return (v.id || v) === z.produkt_id; }).length;
    }, 0);
  };

  var aktive = studioProdukte;
  var spartenLabel = function(s) { return s === "berater" ? "Berater" : "Trainer"; };

  return (<div className="max-w-3xl mx-auto p-4">
    <div className="flex items-center justify-between mb-4"><div className="text-xs font-bold text-gray-400 uppercase tracking-wider">Ziele verwalten</div><button onClick={startAdd} className="px-3 py-1.5 bg-[#0F8A5F] hover:bg-[#13A874] text-white text-xs font-bold rounded-lg">+ Ziel</button></div>
    {edit && (<div className="mb-4 p-4 bg-white border border-emerald-300 rounded-lg space-y-3">
      <div className="text-xs font-bold text-emerald-700 uppercase">Neues Ziel</div>

      {/* Sparten-Auswahl */}
      {istBeratungsBerechtigt ? (<div>
        <label className="text-xs text-gray-500 uppercase tracking-wider">Sparte</label>
        <div className="mt-1 flex gap-2">
          {["trainer", "berater"].map(function(s) {
            var active = form.sparte === s;
            return (<button key={s} type="button" onClick={function() { setForm(Object.assign({}, form, { sparte: s, produkt_id: "", produkt_name: "" })); }} className={"flex-1 px-3 py-2 border rounded-lg text-sm transition-colors " + (active ? "border-emerald-500 bg-emerald-50 text-emerald-800 font-medium" : "border-gray-200 bg-white text-gray-600 hover:border-gray-300")}>{spartenLabel(s)}</button>);
          })}
        </div>
      </div>) : null}

      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="text-xs text-gray-500">{form.sparte === "berater" ? "Erfolg" : "Produkt"}</label>
          {form.sparte === "berater"
            ? (<select value={form.produkt_name} onChange={function(e) { setForm(Object.assign({}, form, { produkt_id: "", produkt_name: e.target.value })); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white">
                <option value="">-- bitte wählen --</option>
                {beraterOptionen.map(function(o) { return <option key={o.key} value={o.key}>{o.label}</option>; })}
              </select>)
            : (<select value={form.produkt_id} onChange={function(e) { var p = aktive.find(function(x) { return x.id === e.target.value; }); setForm(Object.assign({}, form, { produkt_id: e.target.value, produkt_name: p ? p.name : "Alle Verkäufe" })); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white">
                <option value="">Alle Verkäufe</option>
                {aktive.map(function(p) { return <option key={p.id} value={p.id}>{p.name}</option>; })}
              </select>)}
        </div>
        <div><label className="text-xs text-gray-500">Ziel-Anzahl</label><input type="number" min="1" value={form.ziel_anzahl} onChange={function(e) { setForm(Object.assign({}, form, { ziel_anzahl: parseInt(e.target.value) || 1 })); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none" /></div>
        <div><label className="text-xs text-gray-500">Von</label><input type="date" value={form.zeitraum_von} onChange={function(e) { setForm(Object.assign({}, form, { zeitraum_von: e.target.value })); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none" /></div>
        <div><label className="text-xs text-gray-500">Bis</label><input type="date" value={form.zeitraum_bis} onChange={function(e) { setForm(Object.assign({}, form, { zeitraum_bis: e.target.value })); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none" /></div>
      </div>
      <div className="flex gap-2"><button onClick={save} disabled={busy} className="px-4 py-2 bg-[#0F8A5F] hover:bg-[#13A874] disabled:bg-gray-300 text-white text-xs font-bold rounded-lg">{busy ? "..." : "Speichern"}</button><button onClick={function() { setEdit(null); }} className="px-4 py-2 bg-gray-200 text-gray-700 text-xs font-bold rounded-lg">Abbrechen</button></div>
    </div>)}
    <div className="space-y-3">
      {studioZiele.length === 0 && <div className="text-center py-8 text-gray-400 text-sm">Noch keine Ziele definiert.</div>}
      {studioZiele.slice().sort(function(a, b) { return new Date(b.zeitraum_bis) - new Date(a.zeitraum_bis); }).map(function(z) {
        var progress = getProgress(z);
        var pct = Math.min((progress / z.ziel_anzahl) * 100, 100);
        var isActive = today >= z.zeitraum_von && today <= z.zeitraum_bis;
        var isDone = progress >= z.ziel_anzahl;
        var sparte = z.sparte || "trainer";
        return (<div key={z.id} className={"bg-white border rounded-lg p-4 " + (isDone ? "border-emerald-300" : isActive ? "border-gray-200" : "border-gray-100 opacity-60")}>
          <div className="flex items-center justify-between mb-2">
            <div>
              <div className="flex items-center gap-2">
                <span className={"text-xs px-1.5 py-0.5 rounded font-medium " + (sparte === "berater" ? "bg-blue-100 text-blue-700" : "bg-gray-100 text-gray-600")}>{spartenLabel(sparte)}</span>
                <div className="text-sm font-medium text-gray-800">{z.produkt_name || "Alle Verkäufe"}</div>
              </div>
              <div className="text-xs text-gray-400 mt-0.5">{new Date(z.zeitraum_von).toLocaleDateString("de-DE")} – {new Date(z.zeitraum_bis).toLocaleDateString("de-DE")} · von {z.erstellt_von}</div>
            </div>
            <div className="flex items-center gap-2">
              <span className={"text-sm font-bold " + (isDone ? "text-emerald-600" : "text-gray-700")}>{progress}/{z.ziel_anzahl}</span>
              <button onClick={function() { del(z.id); }} className="text-xs text-gray-400 hover:text-red-600">&#10005;</button>
            </div>
          </div>
          <div className="h-3 bg-gray-100 rounded-full overflow-hidden"><div className={"h-full rounded-full transition-all " + (isDone ? "bg-emerald-500" : "bg-amber-400")} style={{ width: pct + "%" }}></div></div>
        </div>);
      })}
    </div>
  </div>);
}

// Block für monatliche Beratungsziele – in ZieleView eingebettet.

function DashboardView({ trainer, produkte, verfuegbarkeit, erfolge, ziele, kategorien, terminarten, erfolgeFullLoad, reloadErfolge, erfolgeReloading }) {
  const isL = trainer.rolle === "leitung";
  const isAdmin = trainer.rolle === "admin";
  const isTrainer = trainer.rolle === "trainer";
  // Dashboard zeigt standardmäßig den aktuellen Monat (Benchmark rechnet separat über die Gesamtzeit).
  var _mNow = new Date();
  var _mVon = ymdLokal(new Date(_mNow.getFullYear(), _mNow.getMonth(), 1));
  var _mBis = ymdLokal(new Date(_mNow.getFullYear(), _mNow.getMonth() + 1, 0));
  // "monat" = Monatsnavigation mit Pfeilen; "custom" = freier Von/Bis-Zeitraum.
  const [zeitraumModus, setZeitraumModus] = useState("monat");
  // Anker für die Monatsnavigation: der Erste des aktuell gezeigten Monats.
  const [monatAnker, setMonatAnker] = useState(new Date(_mNow.getFullYear(), _mNow.getMonth(), 1));
  const [von, setVon] = useState(_mVon);
  const [bis, setBis] = useState(_mBis);

  // Bei Monatsmodus: von/bis immer aus dem Monatsanker ableiten.
  var monVon = ymdLokal(new Date(monatAnker.getFullYear(), monatAnker.getMonth(), 1));
  var monBis = ymdLokal(new Date(monatAnker.getFullYear(), monatAnker.getMonth() + 1, 0));
  var effVon = zeitraumModus === "monat" ? monVon : von;
  var effBis = zeitraumModus === "monat" ? monBis : bis;
  var MONATE_DE = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  var monatLabel = MONATE_DE[monatAnker.getMonth()] + " " + monatAnker.getFullYear();
  var istAktuellerMonat = monatAnker.getFullYear() === _mNow.getFullYear() && monatAnker.getMonth() === _mNow.getMonth();
  var monatWechsel = function(delta) {
    setMonatAnker(function(a) { return new Date(a.getFullYear(), a.getMonth() + delta, 1); });
  };
  const [kat, setKat] = useState("Alle");
  const [tartFilter, setTartFilter] = useState("Alle");
  const [showDeleted, setShowDeleted] = useState(false);
  // Benchmark-Bezug: false = gewählter Zeitraum (Standard), true = Gesamtzeitraum.
  // Der Schalter dazu ist nur für Leitung/Admin/Geschäftsführung sichtbar.
  const [bmGesamt, setBmGesamt] = useState(false);
  const studioData = erfolge.filter(function(x) { return x.studio === trainer.studio; });
  // Trainer sehen nur eigene Erfolge in ihrem Studio
  const baseData = isTrainer
    ? erfolge.filter(function(x) { return x.studio === trainer.studio && x.trainer_id === trainer.id; })
    : studioData;
  const inZeitraum = function(e) {
    var d = new Date(e.datum);
    if (effVon && d < new Date(effVon + "T00:00:00")) return false;
    if (effBis && d > new Date(effBis + "T23:59:59.999")) return false;
    return true;
  };
  // dataAll = Erfolge im Zeitraum aus baseData (Studio für Leitung/Admin, eigene für Trainer)
  // data    = zusätzlich nach Terminart-Filter (für Verkaufs-Auswertung)
  const dataAll = baseData.filter(inZeitraum);
  const data = tartFilter === "Alle" ? dataAll : dataAll.filter(function(e) { return e.terminart === tartFilter; });
  var getKat = function(vid) { var p = produkte.find(function(x) { return x.id === vid; }); return p ? p.kategorie : "Sonstige"; };
  var filterV = function(vList) {
    var arr = vList || [];
    if (!showDeleted) arr = arr.filter(function(v) { return (v.id || v) !== DELETED_PRODUKT_ID; });
    if (kat === "Alle") return arr;
    return arr.filter(function(v) { return getKat(v.id || v) === kat; });
  };
  // Helper: prüft ob Item eine Aktivität ist (kein echter Verkauf)
  var isAktivitaet = function(vid) {
    var p = produkte.find(function(x) { return x.id === vid; });
    return p ? p.ist_aktivitaet === true : false;
  };
  var pc = {};
  data.forEach(function(e) { filterV(e.verkauft).forEach(function(v) { var id = v.id || v; if (isAktivitaet(id)) return; var nm = v.name || v; pc[id] = pc[id] || { name: nm, count: 0, umsatz: 0 }; pc[id].count++; pc[id].umsatz += (Number(v.preis) || 0); }); });
  // pc enthält schon nur echte Verkäufe (ohne Aktivitäten), totalV/totalU stimmt damit automatisch
  var totalV = 0; var totalU = 0; Object.values(pc).forEach(function(x) { totalV += x.count; totalU += x.umsatz; });
  var sp = Object.entries(pc).map(function(entry) { return { id: entry[0], name: entry[1].name, count: entry[1].count, umsatz: entry[1].umsatz }; }).sort(function(a, b) { return b.count - a.count; });
  var mx = 1; sp.forEach(function(s) { if (s.count > mx) mx = s.count; });

  // ===== PRODUKT-RANKING: bewusst ungefiltert =====
  // Listet JEDEN Verkauf im gewählten Zeitraum — Kategorie- und Terminart-Filter
  // wirken hier absichtlich nicht, damit das Ranking nie unvollständig wirkt.
  // Aktivitäten bleiben draußen (sind keine Verkäufe), gelöschte Produkte nur
  // wenn "Gelöschte einblenden" aktiv ist.
  var pcAlle = {};
  dataAll.forEach(function(e) {
    (e.verkauft || []).forEach(function(v) {
      var id = v.id || v;
      if (!showDeleted && id === DELETED_PRODUKT_ID) return;
      if (isAktivitaet(id)) return;
      var nm = v.name || v;
      pcAlle[id] = pcAlle[id] || { name: nm, count: 0, umsatz: 0 };
      pcAlle[id].count++;
      pcAlle[id].umsatz += (Number(v.preis) || 0);
    });
  });
  var spAlle = Object.entries(pcAlle).map(function(entry) { return { id: entry[0], name: entry[1].name, count: entry[1].count, umsatz: entry[1].umsatz }; }).sort(function(a, b) { return b.count - a.count || b.umsatz - a.umsatz; });
  var mxAlle = 1; spAlle.forEach(function(s) { if (s.count > mxAlle) mxAlle = s.count; });

      {data.length > 0 && (<div>

        {!isTrainer && <div className="bg-white border border-gray-200 rounded-lg p-4 text-center"><div className="text-2xl font-black text-emerald-600">{totalU.toFixed(0)}€</div><div className="text-xs text-gray-500 mt-1">{kat === "Alle" ? "Gesamtumsatz" : "Umsatz " + kat}</div></div>}
      </div>

      {/* ============== 3-KPI-BENCHMARK-BLOCK ============== */}
      <div className="bg-white border border-blue-200 rounded-lg p-4 mb-4">

        </div>

          {(function() {

function TerminartenView({ terminarten, setTerminarten, erfolge, setErfolge, trainer }) {
  const [neuLabel, setNeuLabel] = useState("");
  const [creating, setCreating] = useState(false);
  const [err, setErr] = useState("");
  const [editId, setEditId] = useState(null);
  const [editLabel, setEditLabel] = useState("");
  const isAdmin = trainer.rolle === "admin";

  // Anzahl Erfolge pro Terminart-ID (für Anzeige + Lösch-Hinweis)
  const countMap = {};
  erfolge.forEach(function(e) { countMap[e.terminart] = (countMap[e.terminart] || 0) + 1; });

  const sorted = terminarten.slice().sort(function(a, b) { return a.label.localeCompare(b.label, "de"); });

  // ID-Generator: snake_case aus Label, mit Timestamp-Suffix für Eindeutigkeit
  const makeId = function(label) {
    var slug = label.toLowerCase()
      .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
      .replace(/[^a-z0-9]+/g, "_")
      .replace(/^_+|_+$/g, "")
      .slice(0, 30);
    if (!slug) slug = "termin";
    return "t_" + slug + "_" + Date.now().toString().slice(-6);
  };

  const addTart = async function() {
    setErr("");
    var label = neuLabel.trim();
    if (!label) { setErr("Bezeichnung darf nicht leer sein"); return; }
    if (terminarten.find(function(t) { return t.label.toLowerCase() === label.toLowerCase(); })) {
      setErr("Diese Terminart gibt es bereits"); return;
    }
    setCreating(true);
    var newId = makeId(label);
    const res = await sb.from("terminarten").insert([{ id: newId, label: label, aktiv: true }]).select().single();
    setCreating(false);
    if (res.error) { setErr("Fehler: " + res.error.message); return; }
    setTerminarten(function(prev) { return prev.concat([res.data]); });
    setNeuLabel("");
  };

  const startEdit = function(t) {
    setEditId(t.id); setEditLabel(t.label); setErr("");
  };

  const saveEdit = async function() {
    setErr("");
    var label = editLabel.trim();
    if (!label) { setErr("Bezeichnung darf nicht leer sein"); return; }
    var alt = terminarten.find(function(t) { return t.id === editId; });
    if (!alt) return;
    if (label === alt.label) { setEditId(null); return; }
    if (terminarten.find(function(t) { return t.id !== editId && t.label.toLowerCase() === label.toLowerCase(); })) {
      setErr("Diese Terminart gibt es bereits"); return;
    }
    const res = await sb.from("terminarten").update({ label: label }).eq("id", editId);
    if (res.error) { setErr("Fehler: " + res.error.message); return; }
    setTerminarten(function(prev) { return prev.map(function(t) { return t.id === editId ? Object.assign({}, t, { label: label }) : t; }); });
    setEditId(null);
  };

  const delTart = async function(t) {
    setErr("");
    if (t.id === "t_sonstige") { setErr("Die Terminart 'Sonstige' kann nicht gelöscht werden — sie ist der Fallback."); return; }
    var n = countMap[t.id] || 0;
    var msg = n > 0
      ? "Terminart '" + t.label + "' löschen?\n\n" + n + " Erfolg(e) werden auf 'Sonstige' verschoben."
      : "Terminart '" + t.label + "' löschen?";
    if (!confirm(msg)) return;
    if (n > 0) {
      const res1 = await sb.from("erfolge").update({ terminart: "t_sonstige" }).eq("terminart", t.id);
      if (res1.error) { setErr("Fehler beim Umhängen der Erfolge: " + res1.error.message); return; }
      setErfolge(function(prev) { return prev.map(function(e) { return e.terminart === t.id ? Object.assign({}, e, { terminart: "t_sonstige" }) : e; }); });
    }
    const res2 = await sb.from("terminarten").delete().eq("id", t.id);
    if (res2.error) { setErr("Fehler beim Löschen: " + res2.error.message); return; }
    setTerminarten(function(prev) { return prev.filter(function(x) { return x.id !== t.id; }); });
  };

  const toggleGruppe = async function(t) {
    setErr("");
    var newVal = !t.is_gruppentermin;
    const res = await sb.from("terminarten").update({ is_gruppentermin: newVal }).eq("id", t.id);
    if (res.error) { setErr("Fehler: " + res.error.message); return; }
    setTerminarten(function(prev) { return prev.map(function(x) { return x.id === t.id ? Object.assign({}, x, { is_gruppentermin: newVal }) : x; }); });
  };

  return (<div className="max-w-2xl mx-auto p-4">
    <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Terminarten verwalten</div>

    {!isAdmin && (
      <div className="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-lg text-xs text-amber-800">
        <div className="font-bold mb-1">Nur-Lese-Modus</div>
        <div>Anlegen, Umbenennen und Löschen von Terminarten ist nur Admins erlaubt.</div>
      </div>
    )}

    {isAdmin && (

        <div className="flex gap-2 mt-1">

          <button onClick={addTart} disabled={creating || !neuLabel.trim()} className="px-4 py-2 bg-[#0F8A5F] hover:bg-[#13A874] disabled:bg-gray-300 text-white text-xs font-bold rounded-lg">{creating ? "..." : "+ Anlegen"}</button>

    <div className="space-y-1">

              <button onClick={saveEdit} className="px-3 py-1 bg-emerald-600 text-white text-xs font-bold rounded">Speichern</button>

            <>
              <div className="flex items-center gap-3">
                <span className="text-sm text-gray-800">{t.label}</span>
                {isSonstige && <span className="text-xs text-gray-400">(Fallback)</span>}
                {t.is_gruppentermin && <span className="text-xs px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 font-medium">Gruppe</span>}
                <span className="text-xs text-gray-400">{n} Erfolg{n === 1 ? "" : "e"}</span>

              {isAdmin && <div className="flex items-center gap-1">
                {!isSonstige && <button onClick={function() { toggleGruppe(t); }} title={t.is_gruppentermin ? "Als Einzeltermin markieren" : "Als Gruppentermin markieren"} className="text-xs text-gray-400 hover:text-emerald-600 px-2">{t.is_gruppentermin ? "👥" : "👤"}</button>}
                <button onClick={function() { startEdit(t); }} title="Umbenennen" className="text-xs text-gray-400 hover:text-emerald-600 px-2">&#9998;</button>
                {!isSonstige && <button onClick={function() { delTart(t); }} title="Löschen" className="text-xs text-gray-400 hover:text-red-600 px-2">×</button>}
              </div>}
            </>
          )}
        </div>);
      })}
    </div>

    <div className="mt-6 p-3 bg-blue-50 border border-blue-200 rounded-lg text-xs text-blue-700">
      <div className="font-bold mb-1">Hinweis</div>
      <div>Beim Löschen einer Terminart werden alle dranhängenden Erfolge automatisch auf 'Sonstige' verschoben. Die Terminart 'Sonstige' selbst kann nicht gelöscht werden.</div>
    </div>
  </div>);
}

function KategorienView({ kategorien, setKategorien, produkte, setProdukte }) {
  const [neuName, setNeuName] = useState("");
  const [creating, setCreating] = useState(false);
  const [err, setErr] = useState("");
  const [editId, setEditId] = useState(null);
  const [editName, setEditName] = useState("");

  // Anzahl Produkte pro Kategorie (für Anzeige + Lösch-Logik)
  const countMap = {};
  produkte.forEach(function(p) { countMap[p.kategorie] = (countMap[p.kategorie] || 0) + 1; });

  const sorted = kategorien.slice().sort(function(a, b) { return (a.sortierung || 0) - (b.sortierung || 0); });

  const addKat = async function() {
    setErr("");
    var name = neuName.trim();
    if (!name) { setErr("Name darf nicht leer sein"); return; }
    if (kategorien.find(function(k) { return k.name.toLowerCase() === name.toLowerCase(); })) {
      setErr("Diese Kategorie gibt es bereits"); return;
    }
    setCreating(true);
    var maxSort = kategorien.reduce(function(m, k) { return Math.max(m, k.sortierung || 0); }, 0);
    var sortVal = maxSort < 999 ? maxSort + 10 : 100;
    const res = await sb.from("kategorien").insert([{ name: name, sortierung: sortVal }]).select().single();
    setCreating(false);
    if (res.error) { setErr("Fehler: " + res.error.message); return; }
    setKategorien(function(prev) { return prev.concat([res.data]); });
    setNeuName("");
  };

  const startEdit = function(k) {
    setEditId(k.id); setEditName(k.name); setErr("");
  };

  const saveEdit = async function() {
    setErr("");
    var name = editName.trim();
    if (!name) { setErr("Name darf nicht leer sein"); return; }
    var alt = kategorien.find(function(k) { return k.id === editId; });
    if (!alt) return;
    if (name === alt.name) { setEditId(null); return; }
    if (kategorien.find(function(k) { return k.id !== editId && k.name.toLowerCase() === name.toLowerCase(); })) {
      setErr("Diese Kategorie gibt es bereits"); return;
    }
    // Erst Kategorie umbenennen, dann alle Produkte mit altem Namen umhängen
    const res1 = await sb.from("kategorien").update({ name: name }).eq("id", editId);
    if (res1.error) { setErr("Fehler: " + res1.error.message); return; }
    const res2 = await sb.from("produkte").update({ kategorie: name }).eq("kategorie", alt.name);
    if (res2.error) { setErr("Kategorie umbenannt, aber Produkte-Update fehlgeschlagen: " + res2.error.message); return; }
    setKategorien(function(prev) { return prev.map(function(k) { return k.id === editId ? Object.assign({}, k, { name: name }) : k; }); });
    setProdukte(function(prev) { return prev.map(function(p) { return p.kategorie === alt.name ? Object.assign({}, p, { kategorie: name }) : p; }); });
    setEditId(null);
  };

  const delKat = async function(k) {
    setErr("");
    if (k.name === "Sonstige") { setErr("Die Kategorie 'Sonstige' kann nicht gelöscht werden — sie ist der Fallback."); return; }
    var n = countMap[k.name] || 0;
    var msg = n > 0
      ? "Kategorie '" + k.name + "' löschen?\n\n" + n + " Produkt(e) werden auf 'Sonstige' verschoben."
      : "Kategorie '" + k.name + "' löschen?";
    if (!confirm(msg)) return;
    if (n > 0) {
      const res1 = await sb.from("produkte").update({ kategorie: "Sonstige" }).eq("kategorie", k.name);
      if (res1.error) { setErr("Fehler beim Umhängen der Produkte: " + res1.error.message); return; }
      setProdukte(function(prev) { return prev.map(function(p) { return p.kategorie === k.name ? Object.assign({}, p, { kategorie: "Sonstige" }) : p; }); });
    }
    const res2 = await sb.from("kategorien").delete().eq("id", k.id);
    if (res2.error) { setErr("Fehler beim Löschen: " + res2.error.message); return; }
    setKategorien(function(prev) { return prev.filter(function(x) { return x.id !== k.id; }); });
  };

  return (<div className="max-w-2xl mx-auto p-4">
    <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Produkt-Kategorien verwalten</div>

    <div className="mb-4 p-4 bg-white border border-gray-200 rounded-lg">
      <label className="text-xs text-gray-500">Neue Kategorie</label>
      <div className="flex gap-2 mt-1">
        <input value={neuName} onChange={function(e) { setNeuName(e.target.value); }} placeholder="z.B. Ernährungsberatung" className="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none" />
        <button onClick={addKat} disabled={creating || !neuName.trim()} className="px-4 py-2 bg-[#0F8A5F] hover:bg-[#13A874] disabled:bg-gray-300 text-white text-xs font-bold rounded-lg">{creating ? "..." : "+ Anlegen"}</button>
      </div>
    </div>

    {err && <div className="mb-3 p-2 bg-red-50 border border-red-200 rounded text-xs text-red-700">{err}</div>}

    <div className="space-y-1">
      {sorted.map(function(k) {
        var n = countMap[k.name] || 0;
        var isSonstige = k.name === "Sonstige";
        return (<div key={k.id} className="flex items-center justify-between px-3 py-2 bg-white border border-gray-200 rounded-lg">
          {editId === k.id ? (
            <div className="flex-1 flex gap-2">
              <input value={editName} onChange={function(e) { setEditName(e.target.value); }} className="flex-1 px-2 py-1 border border-emerald-300 rounded text-sm focus:border-emerald-500 focus:outline-none" autoFocus />
              <button onClick={saveEdit} className="px-3 py-1 bg-emerald-600 text-white text-xs font-bold rounded">Speichern</button>
              <button onClick={function() { setEditId(null); }} className="px-3 py-1 bg-gray-200 text-gray-700 text-xs font-bold rounded">Abbrechen</button>
            </div>
          ) : (
            <>
              <div className="flex items-center gap-3">
                <span className="text-sm text-gray-800">{k.name}</span>
                {isSonstige && <span className="text-xs text-gray-400">(Fallback)</span>}
                <span className="text-xs text-gray-400">{n} Produkt{n === 1 ? "" : "e"}</span>
              </div>
              <div className="flex items-center gap-1">
                <button onClick={function() { startEdit(k); }} title="Umbenennen" className="text-xs text-gray-400 hover:text-emerald-600 px-2">&#9998;</button>
                {!isSonstige && <button onClick={function() { delKat(k); }} title="Löschen" className="text-xs text-gray-400 hover:text-red-600 px-2">×</button>}
              </div>
            </>
          )}
        </div>);
      })}
    </div>

    <div className="mt-6 p-3 bg-blue-50 border border-blue-200 rounded-lg text-xs text-blue-700">
      <div className="font-bold mb-1">Hinweis</div>
      <div>Beim Löschen einer Kategorie werden alle darin enthaltenen Produkte automatisch in 'Sonstige' verschoben. Umbenennen aktualisiert auch alle Produkte, die diese Kategorie nutzen.</div>
    </div>
  </div>);
}

function BerichteView({ trainer, users, erfolge, terminarten, produkte }) {
  const isAdmin = trainer.rolle === "admin";
  const isLeitung = trainer.rolle === "leitung";
  const isTrainer = trainer.rolle === "trainer";
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth() + 1); // 1-12
  const [targetTrainerId, setTargetTrainerId] = useState(trainer.id);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const tartLabel = function(id) { var t = (terminarten || []).find(function(x) { return x.id === id; }); return t ? t.label : id; };
  const tartIsGruppe = function(id) { var t = (terminarten || []).find(function(x) { return x.id === id; }); return t ? t.is_gruppentermin === true : false; };

  // Wer darf welchen Bericht ziehen:
  // - Trainer: nur sich selbst
  // - Leitung: alle im eigenen Studio
  // - Admin: alle
  const selectableUsers = isAdmin
    ? users
    : isLeitung
      ? users.filter(function(u) { return u.studio === trainer.studio; })
      : users.filter(function(u) { return u.id === trainer.id; });

  const monthLabels = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const yearOptions = [];
  for (var y = today.getFullYear(); y >= today.getFullYear() - 2; y--) yearOptions.push(y);

  const generate = async function() {
    setErr(""); setBusy(true);
    try {
      var target = users.find(function(u) { return u.id === targetTrainerId; });
      if (!target) { setErr("Trainer nicht gefunden."); setBusy(false); return; }

      // Zeitraum: vom 1. des Monats bis zum letzten Tag des Monats inklusive
      var von = new Date(year, month - 1, 1, 0, 0, 0);
      var bis = new Date(year, month, 0, 23, 59, 59);

      // Bericht-Erfolge filtern: eigene Termine + Fitexpresse, bei denen man Partner war.
      // Partner-Termine werden markiert (_alsPartner), damit deren Verkäufe NICHT dem
      // Zieltrainer als Umsatz zugeschrieben werden — nur Termin + Teilnehmer zählen.
      var data = erfolge.filter(function(e) {
        var d = new Date(e.datum);
        if (d < von || d > bis) return false;
        return e.trainer_id === targetTrainerId || e.partner_trainer_id === targetTrainerId;
      }).map(function(e) {
        return Object.assign({}, e, { _alsPartner: e.trainer_id !== targetTrainerId && e.partner_trainer_id === targetTrainerId });
      }).sort(function(a, b) { return new Date(a.datum) - new Date(b.datum); });

      if (data.length === 0) {
        setErr("Keine Erfolge im gewählten Zeitraum für " + target.name + ".");
        setBusy(false);
        return;
      }

      // Sheet 1: Termine (Detailliste)
      var rows1 = [["Datum", "Nr.", "Studio", "Terminart", "Gruppe", "Teilnehmer", "Verkäufe", "Anzahl Verkäufe", "Umsatz €"]];
      data.forEach(function(e) {
        var dDate = new Date(e.datum);
        // Bei Partner-Terminen die Verkäufe dem Haupttrainer überlassen
        var verk = e._alsPartner ? [] : (e.verkauft || []);
        var verkNamen = verk.map(function(v) { return v.name || v.id || ""; }).join(", ");
        var verkSum = verk.reduce(function(s, v) { return s + (Number(v.preis) || 0); }, 0);
        rows1.push([
          dDate.toLocaleDateString("de-DE"),
          e.nummer || "",
          e.studio || "",
          tartLabel(e.terminart) + (e._alsPartner ? " (gemeinsam, Eintrag: " + (e.trainer || "?") + ")" : (e.partner_trainer ? " (gemeinsam mit " + e.partner_trainer + ")" : "")),
          tartIsGruppe(e.terminart) ? "Ja" : "Nein",
          e.teilnehmer_anzahl != null ? e.teilnehmer_anzahl : "",
          verkNamen,
          verk.length,
          Number(verkSum.toFixed(2))
        ]);
      });

      // Sheet 2: Zusammenfassung (KPIs)
      var einzelData = data.filter(function(e) { return !tartIsGruppe(e.terminart); });
      var gruppenData = data.filter(function(e) { return tartIsGruppe(e.terminart); });
      var totalVerkaufe = 0, totalUmsatz = 0;
      data.forEach(function(e) {
        if (e._alsPartner) return; // Verkäufe der Partner-Termine zählen nicht beim Zieltrainer
        (e.verkauft || []).forEach(function(v) {
          totalVerkaufe++;
          totalUmsatz += Number(v.preis) || 0;
        });
      });
      var totalTeilnehmer = gruppenData.reduce(function(s, e) { return s + (e.teilnehmer_anzahl || 0); }, 0);
      var avgTeilnehmer = gruppenData.length > 0 ? (totalTeilnehmer / gruppenData.length) : 0;

      var rows2 = [
        ["Trainer", target.name],
        ["Heimatstudio", target.studio],
        ["Berichtszeitraum", monthLabels[month - 1] + " " + year],
        ["", ""],
        ["Termine gesamt", data.length],
        ["  davon Einzeltermine", einzelData.length],
        ["  davon Gruppentermine", gruppenData.length],
        ["", ""],
        ["Verkäufe gesamt", totalVerkaufe],
        ["Umsatz gesamt €", Number(totalUmsatz.toFixed(2))],
        ["Ø Umsatz/Termin €", einzelData.length > 0 ? Number((totalUmsatz / einzelData.length).toFixed(2)) : 0],
        ["", ""],
        ["Teilnehmer gesamt (Gruppen)", totalTeilnehmer],
        ["Ø Teilnehmer/Gruppentermin", Number(avgTeilnehmer.toFixed(1))]
      ];

      // Sheet 3: Pro Terminart aufschlüsseln
      var byArt = {};
      data.forEach(function(e) {
        var l = tartLabel(e.terminart);
        if (!byArt[l]) byArt[l] = { count: 0, verkaufe: 0, umsatz: 0, teilnehmer: 0, gruppe: tartIsGruppe(e.terminart) };
        byArt[l].count++;
        if (e.teilnehmer_anzahl != null) byArt[l].teilnehmer += e.teilnehmer_anzahl;
        if (e._alsPartner) return; // Verkäufe nur beim Haupttrainer
        (e.verkauft || []).forEach(function(v) {
          byArt[l].verkaufe++;
          byArt[l].umsatz += Number(v.preis) || 0;
        });
      });
      var rows3 = [["Terminart", "Anzahl", "Gruppentermin", "Teilnehmer ges.", "Verkäufe", "Umsatz €"]];
      Object.keys(byArt).sort().forEach(function(l) {
        var x = byArt[l];
        rows3.push([
          l, x.count, x.gruppe ? "Ja" : "Nein",
          x.gruppe ? x.teilnehmer : "",
          x.verkaufe, Number(x.umsatz.toFixed(2))
        ]);
      });

      // Workbook bauen
      var wb = XLSX.utils.book_new();
      var ws1 = XLSX.utils.aoa_to_sheet(rows1);
      ws1["!cols"] = [{wch:12},{wch:5},{wch:12},{wch:25},{wch:8},{wch:11},{wch:40},{wch:8},{wch:10}];
      XLSX.utils.book_append_sheet(wb, ws1, "Termine");

      var ws2 = XLSX.utils.aoa_to_sheet(rows2);
      ws2["!cols"] = [{wch:30},{wch:18}];
      XLSX.utils.book_append_sheet(wb, ws2, "Zusammenfassung");

      var ws3 = XLSX.utils.aoa_to_sheet(rows3);
      ws3["!cols"] = [{wch:30},{wch:8},{wch:14},{wch:15},{wch:10},{wch:12}];
      XLSX.utils.book_append_sheet(wb, ws3, "Pro Terminart");

      // Datei-Name
      var fname = "Monatsbericht_" + target.name.replace(/\s+/g, "_") + "_" + year + "-" + String(month).padStart(2, "0") + ".xlsx";
      XLSX.writeFile(wb, fname);
    } catch (e) {
      setErr("Fehler beim Erstellen: " + (e.message || JSON.stringify(e)));
    } finally {
      setBusy(false);
    }
  };

  return (<div className="max-w-2xl mx-auto p-4">
    <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Monatsbericht</div>

    <div className="bg-white border border-gray-200 rounded-lg p-4 space-y-3">
      <div>
        <label className="text-xs text-gray-500 uppercase tracking-wider">Trainer</label>
        <select value={targetTrainerId} onChange={function(e) { setTargetTrainerId(e.target.value); }} disabled={isTrainer} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white disabled:bg-gray-100">
          {selectableUsers.sort(function(a,b) { return a.name.localeCompare(b.name, "de"); }).map(function(u) { return <option key={u.id} value={u.id}>{u.name} · {u.studio}</option>; })}
        </select>
        {isTrainer && <p className="text-xs text-gray-400 mt-1">Du kannst nur deinen eigenen Bericht runterladen.</p>}
        {isLeitung && <p className="text-xs text-gray-400 mt-1">Als Leitung siehst du alle Trainer aus {trainer.studio}.</p>}
        {isAdmin && <p className="text-xs text-gray-400 mt-1">Als Admin siehst du alle Trainer aller Studios.</p>}
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="text-xs text-gray-500 uppercase tracking-wider">Monat</label>
          <select value={month} onChange={function(e) { setMonth(parseInt(e.target.value, 10)); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white">
            {monthLabels.map(function(l, i) { return <option key={i+1} value={i+1}>{l}</option>; })}
          </select>
        </div>
        <div>
          <label className="text-xs text-gray-500 uppercase tracking-wider">Jahr</label>
          <select value={year} onChange={function(e) { setYear(parseInt(e.target.value, 10)); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white">
            {yearOptions.map(function(y) { return <option key={y} value={y}>{y}</option>; })}
          </select>
        </div>
      </div>

      {err && <div className="p-2 bg-red-50 border border-red-200 rounded text-xs text-red-700">{err}</div>}

      <button onClick={generate} disabled={busy || !targetTrainerId} className="w-full py-2.5 bg-[#0F8A5F] hover:bg-[#13A874] disabled:bg-gray-300 text-white text-sm font-bold rounded-lg">
        {busy ? "Wird erstellt..." : "📥 Bericht als Excel herunterladen"}
      </button>
    </div>

    <div className="mt-6 p-3 bg-blue-50 border border-blue-200 rounded-lg text-xs text-blue-700">
      <div className="font-bold mb-1">Was ist im Bericht enthalten?</div>
      <div>Drei Tabellen-Blätter: alle Termine im Detail (mit Termin-Nr., Verkäufen, Teilnehmern), eine Zusammenfassung mit KPIs und eine Aufschlüsselung pro Terminart. Bei Gruppenterminen ist die Teilnehmerzahl statt Mitgliedsdaten erfasst.</div>
    </div>
  </div>);
}

  const baueMitgliedschaften = function() {
    if (!haupt) return [];
    var arr = [];
    if (BERATUNG_ZUZAHLUNG_PFLICHT.includes(haupt)) {
      // Rehasport / FPZ / T-Rena -> als "<Name> mit/ohne Zuzahlung" speichern.
      arr.push(haupt + " " + (zuzahlung || "ohne Zuzahlung"));
    } else if (haupt === "Präventionskurs") {
      arr.push("Präventionskurs");
      if (praevKurs) arr.push(praevKurs);   // konkreter Kurs zusätzlich, einzeln auswertbar
    } else {
      arr.push(haupt);
    }
    // Zubuchungen anhängen (dedupliziert).
    zubuchungen.forEach(function(z) { if (arr.indexOf(z) === -1) arr.push(z); });
    return arr;
  };

  const persist = async function(mitglArr, istAbschluss) {
    setBusy(true);
    const newB = {
      id: "b" + Date.now(),
      berater_id: trainer.id,
      berater: trainer.name,
      studio: aktivesStudio,
      interessent: interessent.trim(),
      terminart: tart,
      werbequellen: werbequellen,
      mitgliedschaften: mitglArr,
      abschluss: istAbschluss,
      datum: new Date().toISOString()
    };
    const res = await sb.from("beratung").insert([newB]).select().single();
    setBusy(false);
    if (res.error) { alert("Fehler beim Speichern: " + res.error.message); return; }
    const finalB = res.data || newB;
    setBeratungen(function(prev) { return prev.concat([finalB]); });
    setSaved(true);
    setTimeout(function() { reset(); setSaved(false); }, 1500);
  };

  // "Nein" -> kein Abschluss, sofort speichern.
  const handleNein = function() {
    if (!interessent.trim()) { alert("Bitte Name des Interessenten eingeben."); return; }
    if (!tart) { alert("Bitte Terminart auswählen."); return; }
    persist([], false);
  };

  // Hauptmitgliedschaft gewählt -> nächste Phase bestimmen.
  const handleHauptWahl = function(m) {
    setHaupt(m); setPraevKurs(""); setZuzahlung(""); setZubuchungen([]);
    if (BERATUNG_ZUZAHLUNG_PFLICHT.includes(m)) { setPhase("zuzahlung"); return; }
    if (BERATUNG_OHNE_ZUBUCHUNG.includes(m)) { setPhase("fertig"); return; }
    setPhase("zubuchung");
  };

  // Zuzahlung gewählt -> Rehasport/T-Rena haben keine Zubuchungen, FPZ schon.
  const handleZuzahlungWahl = function(z) {
    setZuzahlung(z);
    if (BERATUNG_OHNE_ZUBUCHUNG.includes(haupt)) { setPhase("fertig"); return; }
    setPhase("zubuchung");   // FPZ
  };

  // Abschluss final speichern (aus Phase zubuchung oder fertig).
  const handleAbschlussSpeichern = function() {
    var arr = baueMitgliedschaften();
    if (arr.length === 0) { alert("Bitte zuerst eine Mitgliedschaft auswählen."); return; }
    persist(arr, true);
  };

  const meine = beratungen.filter(function(b) { return b.studio === aktivesStudio && b.berater_id === trainer.id; })
    .slice().sort(function(a, b) { return new Date(b.datum) - new Date(a.datum); });

  const delBeratung = async function(id) {
    if (!confirm("Diese Beratung wirklich löschen? Sie wird auch aus dem Dashboard entfernt.")) return;
    const res = await sb.from("beratung").delete().eq("id", id);
    if (res.error) { alert("Fehler beim Löschen: " + res.error.message); return; }
    setBeratungen(function(prev) { return prev.filter(function(x) { return x.id !== id; }); });
  };

  if (showHistory) {
    return (<div className="max-w-3xl mx-auto p-4">
      <div className="flex items-center justify-between mb-4">
        <div className="text-xs font-bold text-gray-400 uppercase tracking-wider">Meine Beratungen · {aktivesStudio}</div>
        <button onClick={function() { setShowHistory(false); }} className="text-xs text-emerald-600 hover:text-emerald-700 font-medium">← Zurück</button>
      </div>
      {meine.length === 0 && <div className="text-sm text-gray-400 py-8 text-center">Noch keine Beratungen in {aktivesStudio} erfasst.</div>}
      <div className="space-y-2">{meine.map(function(b) {
        return (<div key={b.id} className="bg-white border border-gray-200 rounded-lg p-3">
          <div className="flex items-start justify-between">
            <div>
              <div className="flex items-center gap-2">
                <span className="font-medium text-gray-800">{b.interessent}</span>
                {b.abschluss
                  ? <span className="text-xs px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-full font-medium">Abschluss</span>
                  : <span className="text-xs px-2 py-0.5 bg-gray-100 text-gray-500 rounded-full">kein Abschluss</span>}
              </div>
              <div className="text-xs text-gray-500 mt-1">{beratungTartLabel(b.terminart)} · {new Date(b.datum).toLocaleDateString("de-DE")}</div>
              {(b.werbequellen || []).length > 0 && <div className="text-xs text-gray-400 mt-1">Quelle: {(b.werbequellen || []).join(", ")}</div>}
              {(b.mitgliedschaften || []).length > 0 && <div className="text-xs text-gray-400 mt-0.5">Mitgliedschaft: {(b.mitgliedschaften || []).join(", ")}</div>}
            </div>
            <button onClick={function() { delBeratung(b.id); }} className="text-xs text-gray-300 hover:text-red-500 px-2">🗑</button>
          </div>
        </div>);
      })}</div>
    </div>);
  }

  var renderCheckGroup = function(title, options, selected, setter) {
    return (<div>
      <div className="text-sm font-bold text-gray-700 mb-2">{title}</div>
      <div className="grid grid-cols-2 gap-1.5">{options.map(function(opt) {
        var active = selected.includes(opt);
        return (<label key={opt} className={"flex items-center gap-2 px-3 py-2 border rounded-lg text-sm cursor-pointer transition-colors " + (active ? "border-emerald-500 bg-emerald-50 text-emerald-800" : "border-gray-200 bg-white text-gray-600 hover:border-gray-300")}>
          <input type="checkbox" checked={active} onChange={function() { toggleArr(setter, selected, opt); }} className="flex-shrink-0" />
          <span>{opt}</span>
        </label>);
      })}</div>
    </div>);
  };

  return (<div className="max-w-3xl mx-auto p-4 space-y-5">
    <div className="flex items-center justify-between">
      <div>
        <div className="text-xs font-bold text-gray-400 uppercase tracking-wider">Beratung erfassen</div>
        {istVertretung && <div className="text-xs text-amber-600 font-medium mt-1">Vertretung in {aktivesStudio}</div>}
      </div>
      <button onClick={function() { setShowHistory(true); }} className="text-xs text-emerald-600 hover:text-emerald-700 font-medium">Historie anzeigen</button>
    </div>

    <div>
      <label className="text-sm font-bold text-gray-700 mb-2 block">Name Interessent *</label>
      <input value={interessent} onChange={function(e) { setInteressent(e.target.value); }} placeholder="Vor- und Nachname" className="w-full px-4 py-3 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 focus:outline-none bg-white" />
    </div>

    <div>
      <div className="text-sm font-bold text-gray-700 mb-2">Terminart *</div>
      <div className="flex flex-wrap gap-1.5">{BERATUNG_TERMINARTEN.map(function(t) {
        var active = tart === t.id;
        return (<button key={t.id} onClick={function() { setTart(t.id); }} className={"px-3 py-2 border rounded-lg text-sm transition-colors " + (active ? "border-emerald-500 bg-emerald-50 text-emerald-800 font-medium" : "border-gray-200 bg-white text-gray-600 hover:border-gray-300")}>{t.label}</button>);
      })}</div>
    </div>

    {renderCheckGroup("Werbequelle", BERATUNG_WERBEQUELLEN, werbequellen, setWerbequellen)}

    {/* ===== Geführter Abschluss-Wizard ===== */}
    <div className="border-t border-gray-100 pt-5">
      {saved
        ? <div className="py-6 text-center text-emerald-600 font-bold text-sm">✓ Gespeichert</div>
        : (function() {
        var basisOk = interessent.trim() && tart;

        // Phase 1: Erfolg? Ja / Nein
        if (phase === "frage") {
          return (<div className="text-center">
            <div className="text-base font-bold text-gray-800 mb-4">Erfolg?</div>
            <div className="flex gap-3 justify-center">
              <button onClick={function() { if (!basisOk) { alert("Bitte Name und Terminart ausfüllen."); return; } setPhase("haupt"); }}
                disabled={busy} className="flex-1 max-w-[200px] py-4 bg-[#0F8A5F] hover:bg-[#13A874] disabled:bg-gray-300 text-white font-bold rounded-lg text-base transition-colors">Ja</button>
              <button onClick={handleNein}
                disabled={busy} className="flex-1 max-w-[200px] py-4 bg-gray-100 hover:bg-gray-200 disabled:opacity-50 text-gray-700 font-bold rounded-lg text-base border border-gray-300 transition-colors">{busy ? "Speichern..." : "Nein"}</button>
            </div>
            {!basisOk && <div className="text-xs text-gray-400 mt-3">Bitte zuerst Name und Terminart ausfüllen.</div>}
          </div>);
        }

        // Phase 2: Hauptmitgliedschaft wählen
        if (phase === "haupt") {
          return (<div>
            <div className="flex items-center justify-between mb-3">
              <div className="text-sm font-bold text-gray-700">Mitgliedschaft</div>
              <button onClick={function() { setPhase("frage"); }} className="text-xs text-gray-400 hover:text-gray-600">← zurück</button>
            </div>
            <div className="grid grid-cols-2 gap-1.5">{BERATUNG_HAUPT.map(function(m) {
              return (<button key={m} onClick={function() { handleHauptWahl(m); }}
                className="px-3 py-3 border border-gray-200 bg-white text-gray-700 rounded-lg text-sm hover:border-emerald-400 hover:bg-emerald-50 transition-colors text-left">{m}</button>);
            })}</div>
          </div>);
        }

        // Phase 3a: Zuzahlung (Rehasport / FPZ / T-Rena)
        if (phase === "zuzahlung") {
          return (<div>
            <div className="flex items-center justify-between mb-3">
              <div className="text-sm font-bold text-gray-700">{haupt} – Zuzahlung?</div>
              <button onClick={function() { setHaupt(""); setPhase("haupt"); }} className="text-xs text-gray-400 hover:text-gray-600">← zurück</button>
            </div>
            <div className="grid grid-cols-2 gap-2">{["mit Zuzahlung", "ohne Zuzahlung"].map(function(z) {
              return (<button key={z} onClick={function() { handleZuzahlungWahl(z); }}
                className="px-3 py-4 border border-gray-200 bg-white text-gray-700 rounded-lg text-sm hover:border-emerald-400 hover:bg-emerald-50 transition-colors font-medium">{z}</button>);
            })}</div>
          </div>);
        }

        // Phase 3b: Zubuchungen (Mehrfach) + ggf. konkreter Präventionskurs
        if (phase === "zubuchung") {
          var zubuchListe = BERATUNG_ZUZAHLUNG_PFLICHT.includes(haupt) ? BERATUNG_ZUBUCHUNGEN_REHA : BERATUNG_ZUBUCHUNGEN;
          return (<div>
            <div className="flex items-center justify-between mb-3">
              <div className="text-sm font-bold text-gray-700">Zubuchungen
                <span className="font-normal text-gray-400"> · {haupt}{zuzahlung ? " (" + zuzahlung + ")" : ""}</span>
              </div>
              <button onClick={function() {
                if (BERATUNG_ZUZAHLUNG_PFLICHT.includes(haupt)) { setPhase("zuzahlung"); }
                else { setHaupt(""); setZubuchungen([]); setPhase("haupt"); }
              }} className="text-xs text-gray-400 hover:text-gray-600">← zurück</button>
            </div>

            {haupt === "Präventionskurs" && <div className="mb-4">
              <div className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Welcher Kurs?</div>
              <div className="grid grid-cols-2 gap-1.5">{BERATUNG_PRAEV_KURSE.map(function(k) {
                var active = praevKurs === k;
                return (<button key={k} onClick={function() { setPraevKurs(active ? "" : k); }}
                  className={"px-3 py-2 border rounded-lg text-sm transition-colors " + (active ? "border-emerald-500 bg-emerald-50 text-emerald-800 font-medium" : "border-gray-200 bg-white text-gray-600 hover:border-gray-300")}>{k}</button>);
              })}</div>
            </div>}

            <div className="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Weitere Zubuchungen</div>
            <div className="grid grid-cols-2 gap-1.5">{zubuchListe.map(function(z) {
              var active = zubuchungen.includes(z);
              return (<label key={z} className={"flex items-center gap-2 px-3 py-2 border rounded-lg text-sm cursor-pointer transition-colors " + (active ? "border-emerald-500 bg-emerald-50 text-emerald-800" : "border-gray-200 bg-white text-gray-600 hover:border-gray-300")}>
                <input type="checkbox" checked={active} onChange={function() { toggleArr(setZubuchungen, zubuchungen, z); }} className="flex-shrink-0" />
                <span>{z}</span>
              </label>);
            })}</div>
            <button onClick={function() { setZubuchungen([]); }} className="mt-2 w-full px-3 py-2.5 border border-gray-200 bg-white text-gray-500 rounded-lg text-sm hover:border-gray-300 transition-colors">Keine weitere Zubuchung</button>

            <div className="mt-4 text-xs text-gray-500 bg-gray-50 border border-gray-100 rounded-lg p-2">
              Wird gespeichert: <span className="font-medium text-gray-700">{baueMitgliedschaften().join(", ") || "—"}</span>
            </div>
            <button onClick={handleAbschlussSpeichern} disabled={busy} className="mt-3 w-full py-3 bg-[#0F8A5F] hover:bg-[#13A874] disabled:bg-gray-300 text-white font-bold rounded-lg text-sm transition-colors">
              {busy ? "Speichern..." : "Abschluss speichern"}
            </button>
          </div>);
        }

        // Phase fertig: keine Zubuchungen (EMS / T-Rena / Rehasport) -> direkt speichern
        if (phase === "fertig") {
          return (<div>
            <div className="flex items-center justify-between mb-3">
              <div className="text-sm font-bold text-gray-700">Bestätigen</div>
              <button onClick={function() {
                if (BERATUNG_ZUZAHLUNG_PFLICHT.includes(haupt)) { setPhase("zuzahlung"); }
                else { setHaupt(""); setPhase("haupt"); }
              }} className="text-xs text-gray-400 hover:text-gray-600">← zurück</button>
            </div>
            <div className="text-xs text-gray-500 bg-gray-50 border border-gray-100 rounded-lg p-2">
              Wird gespeichert: <span className="font-medium text-gray-700">{baueMitgliedschaften().join(", ") || "—"}</span>
            </div>
            <button onClick={handleAbschlussSpeichern} disabled={busy} className="mt-3 w-full py-3 bg-[#0F8A5F] hover:bg-[#13A874] disabled:bg-gray-300 text-white font-bold rounded-lg text-sm transition-colors">
              {busy ? "Speichern..." : "Abschluss speichern"}
            </button>
          </div>);
        }
        return null;
      })()}
    </div>
  </div>);
}

function DashboardBeratungView({ trainer, beratungen, users, ziele, beratungFullLoad, reloadBeratung, beratungReloading }) {
  const isAdmin = trainer.rolle === "admin";
  const isGF = (trainer.rolle_echt || trainer.rolle) === "geschaeftsfuehrung";
  // Sichtbereich: Admin alle Studios, sonst nur eigenes Studio.
  const scoped = isAdmin ? beratungen : beratungen.filter(function(b) { return b.studio === trainer.studio; });

  const [laufzeitFilter, setLaufzeitFilter] = useState("alle");
  const [studioFilter, setStudioFilter] = useState(isGF ? "alle" : (isAdmin ? trainer.studio : "alle"));
  const [drilldownLaufzeiten, setDrilldownLaufzeiten] = useState([BERATUNG_LAUFZEITEN[1] || BERATUNG_LAUFZEITEN[0]]);

  // Zeitraum: Default = aktueller Monat. Modus 'monat' (mit ←/→) oder 'custom' (von-bis).
  const heute = new Date();
  const [zeitraumModus, setZeitraumModus] = useState("monat");
  const [aktMonat, setAktMonat] = useState({ y: heute.getFullYear(), m: heute.getMonth() });
  const [customVon, setCustomVon] = useState(ymdLokal(new Date(heute.getFullYear(), heute.getMonth(), 1)));
  const [customBis, setCustomBis] = useState(ymdLokal(new Date(heute.getFullYear(), heute.getMonth() + 1, 0)));

  const zeitraum = (function() {
    if (zeitraumModus === "monat") {
      return { von: new Date(aktMonat.y, aktMonat.m, 1, 0, 0, 0), bis: new Date(aktMonat.y, aktMonat.m + 1, 0, 23, 59, 59) };
    }
    return { von: new Date(customVon + "T00:00:00"), bis: new Date(customBis + "T23:59:59") };
  })();

  const monatsName = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const monatLabel = monatsName[aktMonat.m] + " " + aktMonat.y;
  const istAktuellerMonat = zeitraumModus === "monat" && aktMonat.y === heute.getFullYear() && aktMonat.m === heute.getMonth();
  // Vor mehr als 30 Tagen brauchen wir den vollen Datenstand
  const brauchtVollLoad = !beratungFullLoad && (zeitraum.von < new Date(Date.now() - 30 * 24 * 60 * 60 * 1000));

  // Basis nach Studio- und Laufzeit-Filter (inkl. Zeitraum)
  const gefiltert = scoped.filter(function(b) {
    if (studioFilter !== "alle" && b.studio !== studioFilter) return false;
    if (laufzeitFilter !== "alle") {
      if (!(b.mitgliedschaften || []).includes(laufzeitFilter)) return false;
    }
    var d = new Date(b.datum);
    if (d < zeitraum.von || d > zeitraum.bis) return false;
    return true;
  });

  const quote = function(arr) {
    var ges = arr.length;
    var abg = arr.filter(function(b) { return b.abschluss; }).length;
    return { ges: ges, abg: abg, pct: ges > 0 ? Math.round((abg / ges) * 1000) / 10 : 0 };
  };

  const gesamt = quote(gefiltert);

  // Wellpass-Präventions-Quote: Von Abschlüssen mit "Wellpass" – wie viele kombinieren
  // mindestens einen Präventionskurs (Mobi/Milo/Yara/Luna/MyIntense/MyShape)?
  const wellpass = (function() {
    var basis = gefiltert.filter(function(b) { return b.abschluss && (b.mitgliedschaften || []).includes("Wellpass"); });
    var mitKurs = basis.filter(function(b) {
      return (b.mitgliedschaften || []).some(function(m) { return BERATUNG_PRAEVENTIONSKURSE.includes(m); });
    }).length;
    return { ges: basis.length, mitKurs: mitKurs, pct: basis.length > 0 ? Math.round((mitKurs / basis.length) * 1000) / 10 : 0 };
  })();

  // Gesamt-Zubuchungen aus allen ABGESCHLOSSENEN Beratungen im aktuellen Filter.
  const zubuchungenGesamt = (function() {
    var basis = gefiltert.filter(function(b) { return b.abschluss; });
    var zaehlen = ["Intensivbetreuung", "Getränkeflatrate", "Wellnessflatrate"];
    return zaehlen.map(function(z) {
      var n = basis.filter(function(b) { return (b.mitgliedschaften || []).includes(z); }).length;
      return { name: z, anz: n, pct: basis.length > 0 ? Math.round((n / basis.length) * 1000) / 10 : 0 };
    });
  })();

  // ===== Aktive Berater-Ziele (aus zentralem Ziele-System) =====
  // Aktiv = Zeitraum überschneidet sich mit dem aktuell gewählten Dashboard-Zeitraum.
  const aktiveZiele = (ziele || []).filter(function(z) {
    if ((z.sparte || "trainer") !== "berater") return false;
    if (studioFilter !== "alle" && z.studio !== studioFilter) return false;
    if (!isAdmin && z.studio !== trainer.studio) return false;
    var zVon = new Date(z.zeitraum_von + "T00:00:00"); var zBis = new Date(z.zeitraum_bis + "T23:59:59.999");
    return zVon <= zeitraum.bis && zBis >= zeitraum.von;
  });
  const zielFortschritt = function(z) {
    var basis = beratungen.filter(function(b) {
      if (b.studio !== z.studio) return false;
      var d = new Date(b.datum); var v = new Date(z.zeitraum_von + "T00:00:00"); var bs = new Date(z.zeitraum_bis + "T23:59:59.999");
      return d >= v && d <= bs;
    });
    var ist = 0;
    if (z.produkt_name === "Alle Gespräche") ist = basis.length;
    else if (z.produkt_name === "Alle Abschlüsse") ist = basis.filter(function(b) { return b.abschluss; }).length;
    else ist = basis.filter(function(b) { return b.abschluss && (b.mitgliedschaften || []).includes(z.produkt_name); }).length;
    var pct = z.ziel_anzahl > 0 ? Math.min(100, Math.round(ist / z.ziel_anzahl * 1000) / 10) : 0;
    // Verbleibende Tage bis Ziel-Ende
    var heuteTag = new Date(); heuteTag.setHours(0, 0, 0, 0);
    var bisTag = new Date(z.zeitraum_bis); bisTag.setHours(23, 59, 59);
    var tageRest = Math.max(0, Math.ceil((bisTag - heuteTag) / (24 * 60 * 60 * 1000)));
    var rest = Math.max(0, z.ziel_anzahl - ist);
    var proTag = tageRest > 0 && rest > 0 ? Math.ceil(rest / tageRest) : 0;
    return { ist: ist, pct: pct, rest: rest, tageRest: tageRest, proTag: proTag, laufend: heuteTag >= new Date(z.zeitraum_von) && heuteTag <= bisTag };
  };

  // Pro Studio (für Studio-Vergleich)
  const studioListe = isAdmin ? STUDIOS : [trainer.studio];
  const proStudio = studioListe.map(function(s) {
    var rows = gefiltert.filter(function(b) { return b.studio === s; });
    var interessenten = new Set(rows.map(function(b) { return (b.interessent || "").trim().toLowerCase(); })).size;
    var q = quote(rows);
    return { studio: s, gespraeche: rows.length, interessenten: interessenten, abschluesse: q.abg, pct: q.pct };
  }).filter(function(x) { return x.gespraeche > 0; });

  // GF-Kernvergleich: alle Studios im Zeitraum, UNABHÄNGIG vom Studio-Filter (für GF-Topblock).
  const gfKernvergleich = STUDIOS.map(function(s) {
    var rows = scoped.filter(function(b) {
      if (b.studio !== s) return false;
      if (laufzeitFilter !== "alle" && !(b.mitgliedschaften || []).includes(laufzeitFilter)) return false;
      var d = new Date(b.datum);
      return d >= zeitraum.von && d <= zeitraum.bis;
    });
    var q = quote(rows);
    return { studio: s, gespraeche: rows.length, abschluesse: q.abg, pct: q.pct };
  }).sort(function(a, b) { return b.pct - a.pct; });

  // Mitarbeiter-Ranking nach Abschlüssen
  const proMitarbeiter = (function() {
    var map = {};
    gefiltert.forEach(function(b) {
      var key = b.berater_id || b.berater;
      if (!map[key]) map[key] = { name: b.berater || "?", studio: b.studio, ges: 0, abg: 0 };
      map[key].ges++;
      if (b.abschluss) map[key].abg++;
    });
    return Object.keys(map).map(function(k) {
      var m = map[k];
      m.pct = m.ges > 0 ? Math.round((m.abg / m.ges) * 1000) / 10 : 0;
      return m;
    }).sort(function(a, b) { return b.abg - a.abg; });
  })();

  // Leadquellen-Ranking (über Studio- und Zeitraumfilter, ignoriert Laufzeit)
  const proQuelle = (function() {
    var basis = scoped.filter(function(b) {
      if (studioFilter !== "alle" && b.studio !== studioFilter) return false;
      var d = new Date(b.datum);
      if (d < zeitraum.von || d > zeitraum.bis) return false;
      return true;
    });
    var map = {};
    basis.forEach(function(b) {
      (b.werbequellen || []).forEach(function(q) {
        if (!map[q]) map[q] = { quelle: q, ges: 0, abg: 0 };
        map[q].ges++;
        if (b.abschluss) map[q].abg++;
      });
    });
    return Object.keys(map).map(function(k) {
      var m = map[k];
      m.pct = m.ges > 0 ? Math.round((m.abg / m.ges) * 1000) / 10 : 0;
      return m;
    }).sort(function(a, b) { return b.ges - a.ges; });
  })();

  // Conversion-Champions: Werbequellen mit höchster Abschlussquote (min. 5 Nennungen).
  const MIN_NENNUNGEN = 5;
  const conversionRanking = proQuelle.filter(function(q) { return q.ges >= MIN_NENNUNGEN; })
    .slice().sort(function(a, b) { return b.pct - a.pct; });

  // Drilldown: innerhalb einer oder mehrerer Laufzeiten, wie oft kamen Zusätze dazu.
  // Ein Abschluss zählt zur Basis, wenn er mindestens eine der gewählten Laufzeiten enthält
  // (jeder Abschluss max. einmal, auch bei Mehrfachtreffer).
  const drill = (function() {
    var auswahl = drilldownLaufzeiten || [];
    var basis = scoped.filter(function(b) {
      if (studioFilter !== "alle" && b.studio !== studioFilter) return false;
      var d = new Date(b.datum);
      if (d < zeitraum.von || d > zeitraum.bis) return false;
      if (!b.abschluss) return false;
      var m = b.mitgliedschaften || [];
      return auswahl.some(function(l) { return m.includes(l); });
    });
    var ges = basis.length;
    var zusatzRows = BERATUNG_ZUSAETZE.map(function(z) {
      var anz = basis.filter(function(b) { return (b.mitgliedschaften || []).includes(z); }).length;
      return { zusatz: z, anz: anz, pct: ges > 0 ? Math.round((anz / ges) * 1000) / 10 : 0 };
    });
    return { ges: ges, zusatz: zusatzRows };
  })();

  var maxQuelle = proQuelle.reduce(function(m, q) { return Math.max(m, q.ges); }, 0);

  var statCard = function(label, value, sub) {
    return (<div className="bg-white border border-gray-200 rounded-lg p-4">
      <div className="text-xs text-gray-400 uppercase tracking-wider">{label}</div>
      <div className="text-2xl font-black text-gray-800 mt-1">{value}</div>
      {sub && <div className="text-xs text-gray-400 mt-0.5">{sub}</div>}
    </div>);
  };

  return (<div className="max-w-4xl mx-auto p-4 space-y-5">
    <div className="flex items-center justify-between flex-wrap gap-2">

      <div className="space-y-2">{gfKernvergleich.map(function(s, i) {

        </div>);
      })}</div>
      {gfKernvergleich.every(function(s) { return s.gespraeche === 0; }) && <div className="text-sm text-gray-500 py-2 text-center">Keine Daten im Zeitraum.</div>}
    </div>}

    {/* Filter */}
    <div className="bg-white border border-gray-200 rounded-lg p-3 space-y-3">
      {/* Zeitraum */}
      <div>
        <label className="text-xs text-gray-500 uppercase tracking-wider block mb-1">Zeitraum</label>
        {zeitraumModus === "monat" ? (<div className="flex items-center gap-2 flex-wrap">
          <button onClick={function() { setAktMonat({ y: aktMonat.m === 0 ? aktMonat.y - 1 : aktMonat.y, m: aktMonat.m === 0 ? 11 : aktMonat.m - 1 }); }} className="px-3 py-1.5 border border-gray-300 rounded-lg text-sm hover:bg-gray-50">←</button>

          {!istAktuellerMonat && <button onClick={function() { setAktMonat({ y: heute.getFullYear(), m: heute.getMonth() }); }} className="text-xs text-emerald-600 hover:text-emerald-700 font-medium">→ heute</button>}

        {brauchtVollLoad && <div className="mt-2 text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded p-2 flex items-center justify-between gap-2">

      })}</div>}
