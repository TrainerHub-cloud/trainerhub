// Datum als YYYY-MM-DD in LOKALER Zeit.
// Hintergrund: toISOString() rechnet auf UTC um. In Deutschland (UTC+1/+2)
// wird dabei ein Datum, das auf 00:00 lokaler Zeit steht, auf den VORTAG
// zurueckgeschoben. Genau dadurch fiel der letzte Tag des Monats aus jedem
// Dashboard-Zeitraum heraus. ymdLokal liest Jahr/Monat/Tag direkt in lokaler
// Zeit aus und ist damit von der Zeitzone unabhaengig.
function ymdLokal(d) {
  var m = String(d.getMonth() + 1);
  var t = String(d.getDate());
  if (m.length < 2) m = "0" + m;
  if (t.length < 2) t = "0" + t;
  return d.getFullYear() + "-" + m + "-" + t;
}

// Berechnet alle abgeleiteten Listen neu. Wird nach jeder Config-Änderung aufgerufen.
function rebuildBeratungLists() {
  // Reha-Zubuchungen = volle Zubuchungen ohne EMS und Power Plate.
  BERATUNG_ZUBUCHUNGEN_REHA = BERATUNG_ZUBUCHUNGEN.filter(function(z) {

  // Laufzeiten: Hauptmitgliedschaften, aber Zuzahlungs-Pflicht-Typen als mit/ohne Variante.

  BERATUNG_HAUPT.forEach(function(m) {
    if (BERATUNG_ZUZAHLUNG_PFLICHT.includes(m)) {
      lz.push(m + " mit Zuzahlung"); lz.push(m + " ohne Zuzahlung");

  // Präventionskurse = Sammelwert "Präventionskurs" (falls Hauptmitgliedschaft) + konkrete Kurse.
  var praev = [];
  if (BERATUNG_HAUPT.includes("Präventionskurs")) praev.push("Präventionskurs");

  // Vollständige Liste = Laufzeiten + "Präventionskurs"-Kurse + Zubuchungen, dedupliziert.
  var all = [];
  BERATUNG_LAUFZEITEN.forEach(function(x) { if (all.indexOf(x) === -1) all.push(x); });
  BERATUNG_PRAEV_KURSE.forEach(function(x) { if (all.indexOf(x) === -1) all.push(x); });
  BERATUNG_ZUBUCHUNGEN.forEach(function(x) { if (all.indexOf(x) === -1) all.push(x); });

}

const erlaubteStudios = function(u) {
  if (!u) return [];
  if (u.rolle === "leitung" || u.rolle === "admin" || u.rolle === "geschaeftsfuehrung") return STUDIOS.slice();
  const liste = [u.studio];
  (Array.isArray(u.studios_freigabe) ? u.studios_freigabe : []).forEach(function(sName) {
    if (STUDIOS.indexOf(sName) !== -1 && liste.indexOf(sName) === -1) liste.push(sName);
  });
  // Reihenfolge wie in STUDIOS, damit die Auswahl immer gleich sortiert ist.
  return STUDIOS.filter(function(sName) { return liste.indexOf(sName) !== -1; });
};

// Helper: liefert Produkte, die für ein bestimmtes Studio verfügbar UND aktiv sind
function getStudioProdukte(produkte, verfuegbarkeit, studio, opts) {
  if (!studio) return [];
  // Verfügbarkeits-Zeile je Produkt merken: dort hängt auch die studio-eigene
  // Reihenfolge (sortierung) und das "ganz oben"-Flag.
  const vMap = {};
  verfuegbarkeit.forEach(function(v) { if (v.studio === studio) vMap[v.produkt_id] = v; });
  const excludeAktivitaeten = opts && opts.excludeAktivitaeten;
  return produkte.filter(function(p) {
    if (!p.aktiv || !vMap[p.id]) return false;
    if (excludeAktivitaeten && p.ist_aktivitaet) return false;
    return true;
  }).map(function(p) {
    var v = vMap[p.id];
    return Object.assign({}, p, {
      _sortierung: (v && v.sortierung != null) ? Number(v.sortierung) : 0,
      _ganzOben: !!(v && v.ganz_oben)
    });
  });
}

// Sortiert Produkte nach der studio-eigenen Reihenfolge. Solange die Leitung
// nichts verschoben hat, steht überall sortierung = 0 -> es bleibt beim
// bisherigen alphabetischen Verhalten.
function sortStudioProdukte(list) {
  return list.slice().sort(function(a, b) {
    var sa = a._sortierung || 0;
    var sb = b._sortierung || 0;
    if (sa !== sb) return sa - sb;
    return (a.name || "").localeCompare(b.name || "", "de");
  });
}

// Helper: liefert Studios, in denen ein Produkt verfügbar ist
function getProduktStudios(verfuegbarkeit, produktId) {
  return verfuegbarkeit.filter(function(v) { return v.produkt_id === produktId; }).map(function(v) { return v.studio; });
}

function ProfilModal({ trainer, onClose }) {
  const [oldPw, setOldPw] = useState("");
  const [newPw, setNewPw] = useState("");
  const [confirmPw, setConfirmPw] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [ok, setOk] = useState("");
  const [email, setEmail] = useState("");

  // E-Mail aus Auth-Session laden (steht nicht im trainer-Objekt, da nur public-Daten dort)
  useEffect(function() {
    sb.auth.getUser().then(function(res) {
      if (res.data && res.data.user) setEmail(res.data.user.email || "");
    });
  }, []);

  const change = async function() {
    setErr(""); setOk("");
    if (!oldPw || !newPw || !confirmPw) { setErr("Alle Felder ausfüllen"); return; }
    if (newPw.length < 8) { setErr("Neues Passwort muss mindestens 8 Zeichen haben"); return; }
    if (newPw !== confirmPw) { setErr("Passwort und Bestätigung stimmen nicht überein"); return; }
    if (oldPw === newPw) { setErr("Neues Passwort muss sich vom alten unterscheiden"); return; }

    setLoading(true);
    // 1. Reauth: altes Passwort verifizieren über erneuten Login
    const reauth = await sb.auth.signInWithPassword({ email: email, password: oldPw });
    if (reauth.error) {
      setLoading(false);
      setErr("Aktuelles Passwort ist falsch");
      setOldPw("");
      return;
    }
    // 2. Passwort ändern
    const { error } = await sb.auth.updateUser({ password: newPw });
    setLoading(false);
    if (error) {
      setErr("Fehler beim Ändern: " + error.message);
      return;
    }
    setOk("Passwort wurde geändert. Du bleibst eingeloggt.");
    setOldPw(""); setNewPw(""); setConfirmPw("");
    setTimeout(function() { onClose(); }, 2500);
  };

  return (<div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={onClose}>
    <div className="bg-white rounded-xl max-w-md w-full p-6 space-y-4" onClick={function(e) { e.stopPropagation(); }}>
      <div className="flex items-center justify-between">
        <div className="text-lg font-bold text-gray-800">Mein Profil</div>
        <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-xl leading-none">&#10005;</button>
      </div>

      <div className="space-y-2 pb-4 border-b border-gray-200">
        <div className="flex justify-between text-sm"><span className="text-gray-500">Name</span><span className="text-gray-800 font-medium">{trainer.name}</span></div>
        <div className="flex justify-between text-sm"><span className="text-gray-500">E-Mail</span><span className="text-gray-800 font-medium text-xs">{email}</span></div>
        <div className="flex justify-between text-sm"><span className="text-gray-500">Heimatstudio</span><span className="text-gray-800 font-medium">{trainer.studio}</span></div>
        <div className="flex justify-between text-sm"><span className="text-gray-500">Rolle</span><span className="text-gray-800 font-medium">{rolleLabel(trainer.rolle_echt || trainer.rolle)}</span></div>
      </div>

      <div className="space-y-3">
        <div className="text-sm font-bold text-gray-700">Passwort ändern</div>
        <div>
          <label className="text-xs text-gray-500">Aktuelles Passwort</label>
          <input type="password" autoComplete="current-password" value={oldPw} onChange={function(e) { setOldPw(e.target.value); setErr(""); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label className="text-xs text-gray-500">Neues Passwort (mindestens 8 Zeichen)</label>
          <input type="password" autoComplete="new-password" value={newPw} onChange={function(e) { setNewPw(e.target.value); setErr(""); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none" />
        </div>
        <div>
          <label className="text-xs text-gray-500">Neues Passwort bestätigen</label>
          <input type="password" autoComplete="new-password" value={confirmPw} onChange={function(e) { setConfirmPw(e.target.value); setErr(""); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none" onKeyDown={function(e) { if(e.key==="Enter") change(); }} />
        </div>
        {err && <div className="p-2 bg-red-50 border border-red-200 rounded text-xs text-red-700">{err}</div>}
        {ok && <div className="p-2 bg-emerald-50 border border-emerald-200 rounded text-xs text-emerald-700">{ok}</div>}
        <div className="flex gap-2">
          <button onClick={change} disabled={loading} className="flex-1 px-4 py-2 bg-[#0F8A5F] hover:bg-[#13A874] disabled:bg-gray-400 text-white text-sm font-bold rounded-lg">{loading ? "Ändere..." : "Passwort ändern"}</button>
          <button onClick={onClose} className="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-bold rounded-lg">Abbrechen</button>
        </div>
      </div>
    </div>
  </div>);
}

function Login() {
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);

  const login = async function() {
    if (!email || !pw) return;
    setLoading(true); setErr("");
    const { error } = await sb.auth.signInWithPassword({ email: userToEmail(email), password: pw });
    setLoading(false);
    if (error) { setErr("Benutzername oder Passwort falsch."); setPw(""); }
  };

  return (
    <div className="min-h-screen bg-[#0C2E27] flex items-center justify-center p-4"><div className="w-full max-w-sm">
      <div className="text-center mb-8">
        <div className="text-3xl font-black text-white tracking-tight">TRAINER<span className="text-emerald-400">HUB</span></div>
        <div className="text-xs text-gray-500 mt-1 tracking-widest uppercase">Anmelden</div>
      </div>
      <div className="bg-[#123B32] rounded-xl p-6 space-y-4">
        <div>
          <label className="text-xs text-gray-400 uppercase tracking-wider">Benutzername</label>
          <input type="text" autoComplete="username" value={email} onChange={function(e) { setEmail(e.target.value); setErr(""); }} placeholder="vorname.studio" className="w-full mt-1 px-3 py-2.5 bg-[#1B5245] text-white rounded-lg border border-[#2A6B5A] focus:border-emerald-500 focus:outline-none text-sm" />
        </div>
        <div>
          <label className="text-xs text-gray-400 uppercase tracking-wider">Passwort</label>
          <input type="password" autoComplete="current-password" value={pw} onChange={function(e) { setPw(e.target.value); setErr(""); }} className="w-full mt-1 px-3 py-2.5 bg-[#1B5245] text-white rounded-lg border border-[#2A6B5A] focus:border-emerald-500 focus:outline-none text-sm" onKeyDown={function(e) { if(e.key==="Enter") login(); }} />
        </div>
        {err && <div className="text-xs text-red-400 text-center">{err}</div>}
        <button onClick={login} disabled={!email || !pw || loading} className="w-full py-2.5 bg-[#0F8A5F] hover:bg-[#13A874] disabled:bg-gray-600 disabled:text-gray-400 text-white font-bold rounded-lg text-sm transition-colors">{loading ? "Anmelden..." : "Anmelden"}</button>
        <div className="text-center text-xs text-gray-500 mt-2">Passwort vergessen? Bei Hendrik melden.</div>
      </div>
    </div></div>
  );
}

  // if (darfBer) { tabs.push({ id: "beratung", l: "Erfolge Beratung" }); tabs.push({ id: "dashboard_beratung", l: "Dashboard Beratung" }); }
  tabs.push({ id: "berichte", l: "Bericht Trainer" });
  // Beratungs-Bericht deaktiviert. Zum Reaktivieren einkommentieren:
  // if (darfBer) { tabs.push({ id: "berichte_beratung", l: "Bericht Beratung" }); }
  if (isL) { tabs.push({ id: "team", l: "Team" }); tabs.push({ id: "personalisieren", l: "Personalisieren" }); tabs.push({ id: "ziele", l: "Ziele" }); }
  const rollenLabel = rolleLabel(trainer.rolle_echt || trainer.rolle);
  const rollenColor = isAdmin ? "text-emerald-400" : (isL ? "text-amber-400" : "text-gray-500");
  const istVertretung = aktivesStudio !== trainer.studio;
  const meineStudios = erlaubteStudios(trainer);
  const darfWechseln = meineStudios.length > 1;
  return (<div className="bg-[#0C2E27] text-white px-4 py-3"><div className="max-w-4xl mx-auto flex items-center justify-between flex-wrap gap-2">
    <div className="flex items-center gap-4">
      <div className="font-black text-lg tracking-tight">TRAINER<span className="text-emerald-400">HUB</span></div>
      <div className="flex gap-1">{tabs.map(function(t) { return <button key={t.id} onClick={function() { setView(t.id); }} className={"px-3 py-1.5 rounded-md text-xs font-medium transition-colors " + (view === t.id ? "bg-[#0F8A5F] text-white" : "text-[#7FB3A2] hover:text-white hover:bg-[#123B32]")}>{t.l}</button>; })}</div>
    </div>
    <div className="flex items-center gap-3">
      <div className="flex items-center gap-1.5">
        <button onClick={onProfilClick} className="text-xs text-gray-400 hover:text-white transition-colors" title="Profil und Passwort verwalten">{trainer.name} ⚙</button>
        <span className="text-xs text-gray-500">·</span>
        {darfWechseln
          ? <select value={aktivesStudio} onChange={function(e) { setAktivesStudio(e.target.value); }} className={"text-xs px-2 py-1 rounded-md bg-[#123B32] border focus:outline-none cursor-pointer " + (istVertretung ? "border-amber-500 text-amber-300" : "border-[#2A6B5A] text-[#A7D9C8]")} title={istVertretung ? "Vertretung im fremden Studio" : "Aktuelles Studio"}>
              {meineStudios.map(function(s) { return <option key={s} value={s}>{s}{s === trainer.studio ? " (Heimat)" : ""}</option>; })}
            </select>
          : <span className="text-xs px-2 py-1 rounded-md bg-[#123B32] border border-[#2A6B5A] text-[#A7D9C8]" title="Studio-Wechsel ist fuer dich nicht freigeschaltet">{trainer.studio}</span>}
        <span className={"text-xs ml-1 " + rollenColor}>{rollenLabel}</span>
      </div>
      <button onClick={onLogout} className="text-xs text-gray-500 hover:text-white">Logout</button>
    </div>
  </div></div>);
}

// Fasst mehrfach erfasste Erfolge zusammen: "Probetraining x3, Shake" statt dreimal derselbe Name.
function verkauftLabel(list) {
  const zaehler = [];
  (list || []).forEach(function(v) {
    const name = (v && v.name) ? v.name : v;
    const treffer = zaehler.find(function(z) { return z.name === name; });
    if (treffer) { treffer.n++; } else { zaehler.push({ name: name, n: 1 }); }
  });
  return zaehler.map(function(z) { return z.n > 1 ? z.name + " \u00d7" + z.n : z.name; }).join(", ");
}

function ErfolgeView({ trainer, aktivesStudio, produkte, verfuegbarkeit, erfolge, setErfolge, kategorien, terminarten, users }) {
  const [tart, setTart] = useState("");
  const [sel, setSel] = useState([]);
  const [teilnehmer, setTeilnehmer] = useState("");
  const [partnerTrainerId, setPartnerTrainerId] = useState("");
  const [mengen, setMengen] = useState({});
  const [saved, setSaved] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const aktive = getStudioProdukte(produkte, verfuegbarkeit, aktivesStudio);
  const katNames = (kategorien && kategorien.length > 0) ? kategorien.map(function(k) { return k.name; }) : KATEGORIEN_FALLBACK;
  // Aktivitäten-Items separat halten und unten anzeigen, alle anderen klassisch nach Kategorie gruppieren.
  // Reihenfolge kommt je Studio aus produkt_verfuegbarkeit (siehe ReihenfolgeView).
  const aktivitaeten = sortStudioProdukte(aktive.filter(function(p) { return p.ist_aktivitaet; }));
  const verkaufsItems = aktive.filter(function(p) { return !p.ist_aktivitaet; });
  // "Ganz oben" angepinnte Erfolge stehen über den Kategorie-Blöcken.
  const obenItems = sortStudioProdukte(verkaufsItems.filter(function(p) { return p._ganzOben; }));
  const restItems = verkaufsItems.filter(function(p) { return !p._ganzOben; });
  const grouped = katNames.map(function(k) { return { k: k, items: sortStudioProdukte(restItems.filter(function(p) { return p.kategorie === k; })) }; }).filter(function(g) { return g.items.length > 0; });
  const tartList = (terminarten && terminarten.length > 0) ? terminarten.filter(function(t) { return t.aktiv !== false; }).slice().sort(function(a, b) { return a.label.localeCompare(b.label, "de"); }) : TERMINARTEN_FALLBACK;
  const tartLabel = function(id) { var t = tartList.find(function(x) { return x.id === id; }); if (t) return t.label; var all = (terminarten || []).find(function(x) { return x.id === id; }); return all ? all.label : id; };
  const tartObj = tartList.find(function(t) { return t.id === tart; });
  const isGruppentermin = tartObj && tartObj.is_gruppentermin === true;
  // Menge je Erfolg. Beim Auswaehlen steht automatisch 1, aenderbar ueber die Stepper.
  const menge = function(id) { var n = parseInt(mengen[id], 10); return (isNaN(n) || n < 1) ? 1 : n; };
  const setMenge = function(id, wert) {
    var w = parseInt(wert, 10);
    if (isNaN(w)) w = 1;
    if (w < 1) w = 1;
    if (w > 99) w = 99;
    setMengen(function(m) { var n = Object.assign({}, m); n[id] = w; return n; });
  };
  const toggle = function(id) {
    const drin = sel.includes(id);
    setSel(drin ? sel.filter(function(x) { return x !== id; }) : sel.concat([id]));
    setMengen(function(m) {
      var n = Object.assign({}, m);
      if (drin) { delete n[id]; } else { n[id] = 1; }
      return n;
    });
  };
  // Einheitliche Kachel: Klick waehlt aus, danach erscheint der Anzahl-Stepper.
  const ItemKachel = function(p, ton) {
    const aktiv = sel.includes(p.id);
    // Ausgewaehlt schimmert alles gruen: Aktivitaeten eine Spur heller als die Verkaeufe.
    const c = ton === "hell"
      ? { on: "bg-green-50 border-green-400 text-green-800 shadow-[0_0_0_3px_rgba(74,222,155,0.22)]", btn: "border-green-300 text-green-700 hover:bg-green-100", inp: "border-green-300 text-green-900" }
      : { on: "bg-emerald-50 border-emerald-400 text-emerald-800 shadow-[0_0_0_3px_rgba(16,185,129,0.22)]", btn: "border-emerald-300 text-emerald-700 hover:bg-emerald-100", inp: "border-emerald-300 text-emerald-900" };
    return (<div key={p.id} className={"rounded-lg border transition-all " + (aktiv ? c.on : "bg-white border-gray-200 text-gray-600 hover:border-gray-300")}>
      <button onClick={function() { toggle(p.id); }} className="w-full text-left px-3 py-2 text-xs font-medium">
        <span className="mr-2">{aktiv ? "\u2713" : "\u25CB"}</span>{p.name}
      </button>
      {aktiv && (<div className="flex items-center justify-between gap-2 px-3 pb-2">
        <span className="text-[10px] uppercase tracking-wider opacity-70">Anzahl</span>
        <div className="flex items-center gap-1">
          <button onClick={function() { setMenge(p.id, menge(p.id) - 1); }} disabled={menge(p.id) <= 1} className={"w-6 h-6 rounded-md border bg-white text-sm font-bold leading-none disabled:opacity-30 " + c.btn} title="Weniger">&minus;</button>
          <input type="number" min="1" max="99" inputMode="numeric" value={menge(p.id)} onChange={function(ev) { setMenge(p.id, ev.target.value); }} className={"w-11 h-6 text-center text-xs font-bold rounded-md border bg-white focus:outline-none " + c.inp} />
          <button onClick={function() { setMenge(p.id, menge(p.id) + 1); }} className={"w-6 h-6 rounded-md border bg-white text-sm font-bold leading-none " + c.btn} title="Mehr">+</button>
        </div>
      </div>)}
    </div>);
  };
  const istVertretung = aktivesStudio !== trainer.studio;
  // Mögliche Partner-Trainer: aktive Nutzer im aktiven Studio, außer man selbst
  const partnerKandidaten = (users || []).filter(function(u) {
    return u.studio === aktivesStudio && u.id !== trainer.id && u.aktiv !== false;
  }).slice().sort(function(a, b) { return (a.name || "").localeCompare(b.name || "", "de"); });

  const save = async function() {
    if (!tart) return;
    if (isGruppentermin) {
      var n = parseInt(teilnehmer, 10);
      if (!n || n < 1) { alert("Bitte Teilnehmerzahl eingeben (mindestens 1)."); return; }
    }
    // Verkaufs-Array bauen: jedes Item so oft, wie es als Menge erfasst wurde.
    const vk = [];
    sel.forEach(function(id) {
      const p = produkte.find(function(x) { return x.id === id; });
      const item = { id: id, name: p ? p.name : id, preis: p ? Number(p.preis) : 0 };
      const anzahl = menge(id);
      for (var i = 0; i < anzahl; i++) vk.push(item);
    });

    var partnerObj = (isGruppentermin && partnerTrainerId)
      ? partnerKandidaten.find(function(u) { return u.id === partnerTrainerId; })
      : null;
    const newE = {
      id: "e" + Date.now(),
      trainer_id: trainer.id,
      trainer: trainer.name,
      studio: aktivesStudio,
      terminart: tart,
      verkauft: vk,
      datum: new Date().toISOString(),
      teilnehmer_anzahl: isGruppentermin ? parseInt(teilnehmer, 10) : null,
      partner_trainer_id: partnerObj ? partnerObj.id : null,
      partner_trainer: partnerObj ? partnerObj.name : null
    };
    if (!darfStudio(trainer, aktivesStudio)) {
      alert("Für " + aktivesStudio + " fehlt dir die Freigabe. Deine Leitung kann sie im Team-Bereich setzen.");
      return;
    }
    const res = await sb.from("erfolge").insert([newE]).select().single();
    if (res.error) { alert("Fehler beim Speichern: " + res.error.message); return; }
    const finalE = res.data || newE;
    setErfolge(function(prev) { return prev.concat([finalE]); });
    setSaved(true); setTimeout(function() { setTart(""); setSel([]); setMengen({}); setTeilnehmer(""); setPartnerTrainerId(""); setSaved(false); }, 1500);
  };

  // Historie zeigt eigene Erfolge im aktiven Studio
  const myErfolge = erfolge.filter(function(x) { return x.studio === aktivesStudio && x.trainer_id === trainer.id; });
  const delErfolg = async function(id) {
    if (!confirm("Diesen Erfolg wirklich löschen? Er wird auch aus dem Dashboard entfernt.")) return;
    const res = await sb.from("erfolge").delete().eq("id", id);
    if (res.error) {
      alert("Fehler beim Löschen: " + res.error.message);
      return;
    }
    setErfolge(function(prev) { return prev.filter(function(x) { return x.id !== id; }); });
  };

  return (<div className="max-w-3xl mx-auto p-4">
    <div className="flex items-center justify-between mb-4">
      <div>
        <div className="text-xs font-bold text-gray-400 uppercase tracking-wider">Erfolge erfassen</div>
        {istVertretung && <div className="text-xs text-amber-600 font-medium mt-1">Vertretung in {aktivesStudio}</div>}
      </div>
      <button onClick={function() { setShowHistory(!showHistory); }} className="text-xs text-emerald-600 hover:text-emerald-700 font-medium">{showHistory ? "← Zurück" : "Historie anzeigen"}</button>
    </div>
    {showHistory ? (
      <div className="space-y-2">
        {myErfolge.length === 0 && <div className="text-center py-8 text-gray-400 text-sm">Noch keine Erfolge erfasst.</div>}
        {myErfolge.sort(function(a,b) { return new Date(b.datum) - new Date(a.datum); }).map(function(e) { return (
          <div key={e.id} className="bg-white border border-gray-200 rounded-lg p-3">
            <div className="flex items-center justify-between mb-1">
              <div className="text-sm font-medium text-gray-800 flex items-center gap-2">
                {e.nummer && <span className="inline-flex items-center justify-center w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold">{e.nummer}</span>}
                <span>{e.trainer}</span>
                <span className="text-gray-400">·</span>
                <span className="text-gray-500">{tartLabel(e.terminart)}</span>
                {e.teilnehmer_anzahl != null && <span className="text-xs text-emerald-600 font-medium">· {e.teilnehmer_anzahl} TN</span>}
              </div>
              <div className="flex items-center gap-2">
                <span className="text-xs text-gray-400">{new Date(e.datum).toLocaleDateString("de-DE")}</span>
                <button onClick={function() { delErfolg(e.id); }} className="text-xs text-red-400 hover:text-red-600">&#10005;</button>
              </div>
            </div>
            {e.verkauft && e.verkauft.length > 0 && <div className="text-xs text-gray-500">{verkauftLabel(e.verkauft)}</div>}
          </div>
        ); })}
        {myErfolge.length > 0 && <div className="text-center text-xs text-gray-400 pt-2">Es werden alle deine Erfolge angezeigt. Über das Dashboard lässt sich auf "letzte 30 Tage" umstellen.</div>}
      </div>
    ) : (
      <div>
        {saved && <div className="mb-4 p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-sm text-emerald-700 font-medium">&#10003; Gespeichert</div>}
        <div className="space-y-4">
          <div>
            <label className="text-xs text-gray-500 uppercase tracking-wider">Terminart</label>
            <select value={tart} onChange={function(e) { setTart(e.target.value); setTeilnehmer(""); setPartnerTrainerId(""); }} className="w-full mt-1 px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white"><option value="">Bitte wählen</option>{tartList.map(function(t) { return <option key={t.id} value={t.id}>{t.label}{t.is_gruppentermin ? " (Gruppe)" : ""}</option>; })}</select>
          </div>
          {isGruppentermin && (
            <div>
              <label className="text-xs text-gray-500 uppercase tracking-wider">Teilnehmerzahl</label>
              <input type="number" min="1" value={teilnehmer} onChange={function(e) { setTeilnehmer(e.target.value); }} placeholder="z.B. 12" className="w-full mt-1 px-3 py-2.5 border border-emerald-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-emerald-50" autoFocus />
              <p className="text-xs text-gray-500 mt-1">Bei Gruppenterminen werden keine Mitgliedsnamen erfasst — nur die Anzahl der Teilnehmer.</p>
            </div>
          )}
          {isGruppentermin && partnerKandidaten.length > 0 && (
            <div>
              <label className="text-xs text-gray-500 uppercase tracking-wider">Gemeinsam mit (optional)</label>
              <select value={partnerTrainerId} onChange={function(e) { setPartnerTrainerId(e.target.value); }} className="w-full mt-1 px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white">
                <option value="">Allein durchgeführt</option>
                {partnerKandidaten.map(function(u) { return <option key={u.id} value={u.id}>{u.name}</option>; })}
              </select>
              <p className="text-xs text-gray-500 mt-1">Wird der Fitexpress zu zweit gemacht, fließt er auch beim Partner in die Statistik — er muss ihn nicht selbst eintragen. Die Teilnehmer werden nur einmal gezählt.</p>
            </div>
          )}
          {aktivitaeten.length > 0 && (
            <div className="border-b border-gray-200 pb-4">
              <label className="text-xs text-gray-500 uppercase tracking-wider mb-3 block">Aktivitäten <span className="text-gray-400 normal-case font-normal">(kein Verkauf, nur Markierung)</span></label>
              <div className="grid grid-cols-2 gap-2 items-start">
                {aktivitaeten.map(function(p) { return ItemKachel(p, "hell"); })}
              </div>
            </div>
          )}
          <div><label className="text-xs text-gray-500 uppercase tracking-wider mb-3 block">{isGruppentermin ? "Verkauft / Gebucht (optional)" : "Verkauft / Gebucht"}</label>
            {obenItems.length > 0 && (<div className="mb-3 pb-3 border-b border-gray-200"><div className="grid grid-cols-2 gap-2 items-start">{obenItems.map(function(p) { return ItemKachel(p, "gruen"); })}</div></div>)}
            {grouped.map(function(g) { return (<div key={g.k} className="mb-3"><div className="text-xs font-bold text-gray-400 mb-1.5">{g.k}</div><div className="grid grid-cols-2 gap-2 items-start">{g.items.map(function(p) { return ItemKachel(p, "gruen"); })}</div></div>); })}
          </div>
          <button onClick={save} disabled={!tart} className="w-full py-3 bg-[#0F8A5F] hover:bg-[#13A874] disabled:bg-gray-300 text-white font-bold rounded-lg text-sm transition-colors">Erfolg speichern</button>
        </div>
      </div>
    )}
  </div>);
}

function TeamView({ trainer, users, setUsers }) {
  const [edit, setEdit] = useState(null);
  const [form, setForm] = useState({ name: "", studio: STUDIOS[3], rolle: "trainer", aktiv: true, beratung_freigabe: false, studios_freigabe: [] });
  const [createForm, setCreateForm] = useState(null);
  const [creating, setCreating] = useState(false);
  const [createErr, setCreateErr] = useState("");
  const [createOk, setCreateOk] = useState("");
  const [pwModal, setPwModal] = useState(null);
  const [pw1, setPw1] = useState("");
  const [pw2, setPw2] = useState("");
  const [pwLoading, setPwLoading] = useState(false);
  const [pwErr, setPwErr] = useState("");
  const [pwOk, setPwOk] = useState("");
  const isAdmin = trainer.rolle === "admin";

  const canResetUser = function(u) {
    if (!trainer || !u) return false;
    if (u.id === trainer.id) return false;
    if (trainer.rolle === "admin") return true;
    if (trainer.rolle === "leitung") {
      if (u.studio !== trainer.studio) return false;
      if (u.rolle === "admin") return false;
      return true;
    }
    return false;
  };

  const startReset = function(u) {
    setPwModal(u);
    setPw1(""); setPw2(""); setPwErr(""); setPwOk("");
  };

  const submitReset = async function() {
    setPwErr(""); setPwOk("");
    if (pw1.length < 8) { setPwErr("Passwort mindestens 8 Zeichen"); return; }
    if (pw1 !== pw2) { setPwErr("Passwörter stimmen nicht überein"); return; }
    setPwLoading(true);
    const { data, error } = await sb.functions.invoke("admin-reset-password", {
      body: { target_user_id: pwModal.id, new_password: pw1 },
    });
    setPwLoading(false);
    if (error || (data && data.error)) {
      setPwErr((data && data.error) || error.message || "Reset fehlgeschlagen");
      return;
    }
    setPwOk("Passwort für " + pwModal.name + " wurde gesetzt. Mündlich weitergeben — niemals per E-Mail oder Chat.");
    setPw1(""); setPw2("");
  };

  const startCreate = function() {
    setCreateForm({
      email: "",
      password: "",
      name: "",
      studio: trainer.studio,
      rolle: "trainer",
    });
    setCreateErr(""); setCreateOk("");
  };

  const submitCreate = async function() {
    if (!createForm.email || !createForm.password || !createForm.name) {
      setCreateErr("Alle Felder ausfüllen"); return;
    }
    if (createForm.password.length < 8) {
      setCreateErr("Passwort mindestens 8 Zeichen"); return;
    }
    setCreating(true); setCreateErr(""); setCreateOk("");
    const { data, error } = await sb.functions.invoke("create-trainer", {
      body: {
        email: userToEmail(createForm.email),
        password: createForm.password,
        name: createForm.name.trim(),
        studio: createForm.studio,
        rolle: createForm.rolle,
      },
    });
    setCreating(false);
    if (error || (data && data.error)) {
      setCreateErr((data && data.error) || error.message || "Fehler beim Anlegen");
      return;
    }
    if (data && data.success) {
      // Neuen User in lokale Liste aufnehmen
      const newUser = { id: data.user.id, name: data.user.name, studio: data.user.studio, rolle: data.user.rolle, aktiv: true };
      setUsers(function(prev) { return prev.concat([newUser]); });
      setCreateOk("Trainer angelegt: " + userToEmail(createForm.email));
      setCreateForm(null);
      setTimeout(function() { setCreateOk(""); }, 4000);
    }
  };

  const startEdit = function(u) {
    setForm({ name: u.name, studio: u.studio, rolle: u.rolle, aktiv: u.aktiv !== false, beratung_freigabe: u.beratung_freigabe === true, studios_freigabe: Array.isArray(u.studios_freigabe) ? u.studios_freigabe : [], id: u.id });
    setEdit(u.id);
  };
  const save = async function() {
    if (!form.name.trim()) return;
    const update = { name: form.name.trim(), studio: form.studio, rolle: form.rolle, aktiv: form.aktiv, beratung_freigabe: form.beratung_freigabe === true, studios_freigabe: (form.studios_freigabe || []).filter(function(x) { return x !== form.studio; }) };
    const res = await sb.from("users").update(update).eq("id", edit);
    if (res.error) { alert("Fehler: " + res.error.message); return; }
    setUsers(function(prev) { return prev.map(function(u) { return u.id === edit ? Object.assign({}, u, update) : u; }); });
    setEdit(null);
  };

  const visible = isAdmin ? users : users.filter(function(u) { return u.studio === trainer.studio; });
  const grouped = STUDIOS.map(function(s) { return { s: s, items: visible.filter(function(u) { return u.studio === s; }).slice().sort(function(a, b) { return (a.name || "").localeCompare(b.name || "", "de"); }) }; }).filter(function(g) { return g.items.length > 0; });

  return (<div className="max-w-3xl mx-auto p-4">
    <div className="flex items-center justify-between mb-4">
      <div className="text-xs font-bold text-gray-400 uppercase tracking-wider">Team {isAdmin ? "(alle Studios)" : "· " + trainer.studio}</div>
      <button onClick={startCreate} className="px-3 py-1.5 bg-[#0F8A5F] hover:bg-[#13A874] text-white text-xs font-bold rounded-lg">+ Trainer anlegen</button>
    </div>

    {createOk && <div className="mb-3 p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-sm text-emerald-700">{createOk}</div>}

          <label className="text-xs text-gray-500">Studio</label>
          <select value={createForm.studio} onChange={function(e) { setCreateForm(Object.assign({}, createForm, { studio: e.target.value })); }} disabled={!isAdmin} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white disabled:bg-gray-100">{STUDIOS.map(function(s) { return <option key={s}>{s}</option>; })}</select>
          {!isAdmin && <div className="text-xs text-gray-400 mt-0.5">Leitung kann nur fürs eigene Studio anlegen</div>}
        </div>
        <div>
          <label className="text-xs text-gray-500">Rolle</label>
          <select value={createForm.rolle} onChange={function(e) { setCreateForm(Object.assign({}, createForm, { rolle: e.target.value })); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white">
            <option value="trainer">Trainer</option>
            <option value="leitung">Leitung</option>

        <div className="col-span-2">
          <label className="text-xs text-gray-500">Initialpasswort (mindestens 8 Zeichen)</label>
          <input type="text" value={createForm.password} onChange={function(e) { setCreateForm(Object.assign({}, createForm, { password: e.target.value })); }} placeholder="z.B. Trainer-Brinkum-2026" className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none font-mono" />
          <div className="text-xs text-gray-400 mt-0.5">Klartext sichtbar — gib es dem Trainer und sage ihm, es nach dem ersten Login zu ändern.</div>
        </div>
      </div>
      {createErr && <div className="p-2 bg-red-50 border border-red-200 rounded text-xs text-red-700">{createErr}</div>}
      <div className="flex gap-2">
        <button onClick={submitCreate} disabled={creating} className="px-4 py-2 bg-[#0F8A5F] hover:bg-[#13A874] disabled:bg-gray-400 text-white text-xs font-bold rounded-lg">{creating ? "Wird angelegt..." : "Trainer anlegen"}</button>
        <button onClick={function() { setCreateForm(null); setCreateErr(""); }} className="px-4 py-2 bg-gray-200 text-gray-700 text-xs font-bold rounded-lg">Abbrechen</button>
      </div>
    </div>)}

    {pwOk && <div className="mb-3 p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-sm text-emerald-700">{pwOk}</div>}

    {grouped.map(function(g) { return (<div key={g.s} className="mb-4"><div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">{g.s}</div><div className="space-y-1">{g.items.map(function(u) {
      var isEditing = edit === u.id;
      return (
      <React.Fragment key={u.id}>
      <div className={"flex items-center justify-between px-3 py-2 border text-sm " + (isEditing ? "rounded-t-lg bg-emerald-50 border-emerald-300" : "rounded-lg " + (u.aktiv === false ? "bg-gray-50 border-gray-100 opacity-50" : "bg-white border-gray-200"))}>
        <div className="flex items-center gap-3"><span className="text-gray-800">{u.name}</span><span className={"text-xs " + ((u.rolle === "admin" || u.rolle === "geschaeftsfuehrung") ? "text-emerald-600" : u.rolle === "leitung" ? "text-amber-600" : "text-gray-400")}>{rolleLabel(u.rolle)}</span>{u.aktiv === false && <span className="text-xs text-red-400">deaktiviert</span>}{u.rolle === "trainer" && u.beratung_freigabe === true && <span className="text-xs px-1.5 py-0.5 bg-blue-100 text-blue-600 rounded">Beratung</span>}{u.rolle === "trainer" && Array.isArray(u.studios_freigabe) && u.studios_freigabe.length > 0 && <span className="text-xs px-1.5 py-0.5 bg-emerald-100 text-emerald-700 rounded" title={"Zusätzlich freigegeben: " + u.studios_freigabe.join(", ")}>+{u.studios_freigabe.length} Studio{u.studios_freigabe.length > 1 ? "s" : ""}</span>}</div>
        <div className="flex items-center gap-1">
          {canResetUser(u) && <button onClick={function() { startReset(u); }} title="Passwort zurücksetzen" className="text-xs text-gray-400 hover:text-amber-600 px-2">🔑</button>}
          <button onClick={function() { isEditing ? setEdit(null) : startEdit(u); }} title={isEditing ? "Abbrechen" : "Bearbeiten"} className={"text-xs px-2 " + (isEditing ? "text-emerald-600 font-bold" : "text-gray-400 hover:text-emerald-600")}>{isEditing ? "▲" : "✎"}</button>
        </div>
      </div>
      {isEditing && (
        <div className="px-4 py-3 bg-emerald-50 border-x border-b border-emerald-300 rounded-b-lg space-y-3 mb-2">
          <div className="grid grid-cols-2 gap-3">
            <div><label className="text-xs text-gray-500">Name</label><input value={form.name} onChange={function(e) { setForm(Object.assign({}, form, { name: e.target.value })); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none" /></div>
            <div><label className="text-xs text-gray-500">Studio</label><select value={form.studio} onChange={function(e) { setForm(Object.assign({}, form, { studio: e.target.value })); }} disabled={!isAdmin} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white disabled:bg-gray-100">{STUDIOS.map(function(s) { return <option key={s}>{s}</option>; })}</select></div>
            <div><label className="text-xs text-gray-500">Rolle</label><select value={form.rolle} onChange={function(e) { setForm(Object.assign({}, form, { rolle: e.target.value })); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white"><option value="trainer">Trainer</option><option value="leitung">Leitung</option>{isAdmin && <option value="admin">Admin</option>}{isAdmin && <option value="geschaeftsfuehrung">Geschäftsführung</option>}</select></div>
            <div className="flex items-end"><label className="flex items-center gap-2 text-sm text-gray-600 cursor-pointer"><input type="checkbox" checked={form.aktiv} onChange={function(e) { setForm(Object.assign({}, form, { aktiv: e.target.checked })); }} />Aktiv</label></div>
          </div>
          <div className="pt-1">
            {(form.rolle === "leitung" || form.rolle === "admin")
              ? <div className="text-xs text-gray-400">Beratungsfreigabe ist für {form.rolle === "admin" ? "Admins" : "Leitung"} automatisch aktiv.</div>
              : <label className="flex items-center gap-2 text-sm text-gray-600 cursor-pointer"><input type="checkbox" checked={form.beratung_freigabe} onChange={function(e) { setForm(Object.assign({}, form, { beratung_freigabe: e.target.checked })); }} />Beratungsfreigabe (Zugriff auf Beratung-Tabs &amp; -Dashboard)</label>}
          </div>
          <div className="pt-1">
            {(form.rolle === "leitung" || form.rolle === "admin" || form.rolle === "geschaeftsfuehrung")
              ? <div className="text-xs text-gray-400">Zugriff auf alle Studios ist für diese Rolle automatisch aktiv.</div>
              : (<div>
                  <div className="text-xs text-gray-500 mb-1.5">Zusätzliche Studios (Erfolge erfassen und Dashboard sehen)</div>
                  <div className="flex flex-wrap gap-x-4 gap-y-1.5">
                    {STUDIOS.map(function(sName) {
                      const heimat = sName === form.studio;
                      const an = heimat || (form.studios_freigabe || []).indexOf(sName) !== -1;
                      return (<label key={sName} className={"flex items-center gap-1.5 text-sm " + (heimat ? "text-gray-400" : "text-gray-600 cursor-pointer")}>
                        <input type="checkbox" checked={an} disabled={heimat} onChange={function(e) {
                          const alt = (form.studios_freigabe || []).filter(function(x) { return x !== sName; });
                          setForm(Object.assign({}, form, { studios_freigabe: e.target.checked ? alt.concat([sName]) : alt }));
                        }} />{sName}{heimat ? " (Heimat)" : ""}
                      </label>);
                    })}
                  </div>
                </div>)}
          </div>
          <div className="flex gap-2"><button onClick={save} className="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg">Speichern</button><button onClick={function() { setEdit(null); }} className="px-4 py-2 bg-gray-200 text-gray-700 text-xs font-bold rounded-lg">Abbrechen</button></div>
        </div>
      )}
      </React.Fragment>); })}</div></div>); })}

    {pwModal && (<div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={function() { if (!pwLoading) setPwModal(null); }}>
      <div className="bg-white rounded-lg shadow-xl max-w-md w-full p-6" onClick={function(e) { e.stopPropagation(); }}>
        <div className="text-xs font-bold text-amber-700 uppercase mb-2">Passwort zurücksetzen</div>
        <div className="text-sm text-gray-700 mb-1"><span className="font-medium">{pwModal.name}</span> · <span className="text-gray-500">{pwModal.studio}</span> · <span className="text-gray-500">{rolleLabel(pwModal.rolle)}</span></div>
        <div className="mb-4 p-2 bg-amber-50 border border-amber-200 rounded text-xs text-amber-800">Du setzt das Passwort eines anderen Users. Gib es mündlich weiter — niemals per E-Mail oder Chat.</div>
        <div className="space-y-3">
          <div><label className="text-xs text-gray-500">Neues Passwort (mindestens 8 Zeichen)</label><input type="text" value={pw1} onChange={function(e) { setPw1(e.target.value); }} placeholder="z.B. Reset-2026-Brinkum" className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-amber-500 focus:outline-none font-mono" autoFocus /></div>
          <div><label className="text-xs text-gray-500">Wiederholen</label><input type="text" value={pw2} onChange={function(e) { setPw2(e.target.value); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-amber-500 focus:outline-none font-mono" /></div>
        </div>
        {pwErr && <div className="mt-3 p-2 bg-red-50 border border-red-200 rounded text-xs text-red-700">{pwErr}</div>}
        <div className="flex gap-2 mt-4">
          <button onClick={submitReset} disabled={pwLoading || !pw1 || !pw2} className="px-4 py-2 bg-amber-600 hover:bg-amber-500 disabled:bg-gray-300 text-white text-xs font-bold rounded-lg">{pwLoading ? "Wird gesetzt..." : "Passwort setzen"}</button>
          <button onClick={function() { setPwModal(null); }} disabled={pwLoading} className="px-4 py-2 bg-gray-200 text-gray-700 text-xs font-bold rounded-lg">Schließen</button>

}

// ============================================================================
// PersonalisierenView – fasst Produkte / Kategorien / Terminarten und die
// Beratungs-Konfiguration unter einer Button-Navigation zusammen.
// ============================================================================
function BeratungConfigEditor({ setConfigVersion }) {
  // Lokaler, editierbarer Zustand – initialisiert aus den aktuellen Listen.
  const [werbequellen, setWerbequellen] = useState(BERATUNG_WERBEQUELLEN.slice());
  const [terminarten, setTerminarten] = useState(BERATUNG_TERMINARTEN.map(function(t) { return Object.assign({}, t); }));
  const [haupt, setHaupt] = useState(BERATUNG_HAUPT.slice());
  const [zubuchungen, setZubuchungen] = useState(BERATUNG_ZUBUCHUNGEN.slice());
  const [praevKurse, setPraevKurse] = useState(BERATUNG_PRAEV_KURSE.slice());
  const [busy, setBusy] = useState(false);
  const [saved, setSaved] = useState(false);
  const [neuWerbe, setNeuWerbe] = useState("");
  const [neuHaupt, setNeuHaupt] = useState("");
  const [neuZub, setNeuZub] = useState("");
  const [neuKurs, setNeuKurs] = useState("");
  const [neuTartLabel, setNeuTartLabel] = useState("");

  const slug = function(s) {
    return s.toLowerCase().replace(/[äöü]/g, function(c) { return { "ä": "ae", "ö": "oe", "ü": "ue" }[c]; })
      .replace(/ß/g, "ss").replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 30) || ("t" + Date.now());
  };

  // Generische Listen-Helfer für String-Listen.
  const addStr = function(setter, list, val, clear) {
    var v = (val || "").trim();
    if (!v) return;
    if (list.indexOf(v) !== -1) { alert("\"" + v + "\" ist bereits vorhanden."); return; }
    setter(list.concat([v])); clear("");
  };
  const removeStr = function(setter, list, idx) { setter(list.filter(function(_, i) { return i !== idx; })); };
  const moveStr = function(setter, list, idx, dir) {
    var ni = idx + dir; if (ni < 0 || ni >= list.length) return;
    var copy = list.slice(); var tmp = copy[idx]; copy[idx] = copy[ni]; copy[ni] = tmp; setter(copy);
  };

  const speichern = async function() {
    // Validierung: keine leeren Terminart-Labels.
    for (var i = 0; i < terminarten.length; i++) {
      if (!terminarten[i].label || !terminarten[i].label.trim()) { alert("Terminart-Label darf nicht leer sein."); return; }
    }
    if (haupt.length === 0) { alert("Mindestens eine Mitgliedschaft ist erforderlich."); return; }
    setBusy(true);
    var cfg = {
      werbequellen: werbequellen,
      terminarten: terminarten.map(function(t) { return { id: t.id, label: t.label.trim() }; }),
      haupt: haupt,
      zubuchungen: zubuchungen,
      praev_kurse: praevKurse
    };
    // Upsert in beratung_config (eine feste Zeile, id = 1).
    var res = await sb.from("beratung_config").upsert([{ id: 1, config: cfg }], { onConflict: "id" });
    setBusy(false);
    if (res.error) { alert("Fehler beim Speichern: " + res.error.message + "\n\nWurde die Tabelle beratung_config angelegt?"); return; }
    // Laufzeit-Listen aktualisieren + Re-Render erzwingen.
    setzeBeratungConfig(cfg);
    if (setConfigVersion) setConfigVersion(function(v) { return v + 1; });
    setSaved(true); setTimeout(function() { setSaved(false); }, 2000);
  };

  var feldKlasse = "flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none";
  var addBtn = "px-3 py-2 bg-[#0C2E27] hover:bg-[#123B32] text-white text-sm font-bold rounded-lg";

  // Wiederverwendbarer Editor für eine String-Liste.
  var StringListe = function(props) {
    return (<div className="bg-white border border-gray-200 rounded-lg p-4">
      <div className="text-sm font-bold text-gray-700 mb-1">{props.titel}</div>
      {props.hinweis && <div className="text-xs text-gray-400 mb-3">{props.hinweis}</div>}
      <div className="space-y-1.5 mb-3">{props.list.map(function(item, idx) {
        return (<div key={item + idx} className="flex items-center gap-2">
          <span className="flex-1 px-3 py-1.5 bg-gray-50 border border-gray-100 rounded text-sm text-gray-700">{item}</span>
          <button onClick={function() { moveStr(props.setter, props.list, idx, -1); }} disabled={idx === 0} className="px-2 py-1 text-gray-400 hover:text-gray-700 disabled:opacity-30 text-xs">▲</button>
          <button onClick={function() { moveStr(props.setter, props.list, idx, 1); }} disabled={idx === props.list.length - 1} className="px-2 py-1 text-gray-400 hover:text-gray-700 disabled:opacity-30 text-xs">▼</button>
          <button onClick={function() { removeStr(props.setter, props.list, idx); }} className="px-2 py-1 text-gray-400 hover:text-red-600 text-sm">&#10005;</button>
        </div>);
      })}{props.list.length === 0 && <div className="text-xs text-gray-400 italic">Noch keine Einträge.</div>}</div>
      <div className="flex gap-2">
        <input value={props.neu} onChange={function(e) { props.setNeu(e.target.value); }} onKeyDown={function(e) { if (e.key === "Enter") addStr(props.setter, props.list, props.neu, props.setNeu); }} placeholder={props.placeholder || "Neuer Eintrag"} className={feldKlasse} />
        <button onClick={function() { addStr(props.setter, props.list, props.neu, props.setNeu); }} className={addBtn}>+ Hinzufügen</button>
      </div>
    </div>);
  };

  return (<div className="space-y-4">
    <div className="text-xs text-gray-500 bg-amber-50 border border-amber-200 rounded-lg p-3">
      Änderungen hier gelten studioübergreifend für die gesamte Beratungserfassung und -auswertung.
      Bereits gespeicherte Abschlüsse behalten ihre alten Werte. Nach dem Speichern unten aktiv.
    </div>

    {/* Werbequellen */}
    <StringListe titel="Werbequellen" hinweis="Mehrfachauswahl bei der Erfassung. Reihenfolge = Anzeige-Reihenfolge."
      list={werbequellen} setter={setWerbequellen} neu={neuWerbe} setNeu={setNeuWerbe} placeholder="z. B. Plakatwerbung" />

    {/* Terminarten (id + label) */}
    <div className="bg-white border border-gray-200 rounded-lg p-4">
      <div className="text-sm font-bold text-gray-700 mb-1">Terminarten</div>
      <div className="text-xs text-gray-400 mb-3">Art des Beratungstermins (Auswahl genau einer). Die interne ID bleibt stabil – Umbenennen ändert nur die Anzeige.</div>
      <div className="space-y-1.5 mb-3">{terminarten.map(function(t, idx) {
        return (<div key={t.id} className="flex items-center gap-2">
          <input value={t.label} onChange={function(e) { var c = terminarten.slice(); c[idx] = Object.assign({}, c[idx], { label: e.target.value }); setTerminarten(c); }} className="flex-1 px-3 py-1.5 border border-gray-200 rounded text-sm focus:border-emerald-500 focus:outline-none" />
          <span className="text-xs text-gray-300 font-mono">{t.id}</span>
          <button onClick={function() { moveStr(setTerminarten, terminarten, idx, -1); }} disabled={idx === 0} className="px-2 py-1 text-gray-400 hover:text-gray-700 disabled:opacity-30 text-xs">▲</button>
          <button onClick={function() { moveStr(setTerminarten, terminarten, idx, 1); }} disabled={idx === terminarten.length - 1} className="px-2 py-1 text-gray-400 hover:text-gray-700 disabled:opacity-30 text-xs">▼</button>
          <button onClick={function() { if (confirm("Terminart \"" + t.label + "\" entfernen?")) setTerminarten(terminarten.filter(function(_, i) { return i !== idx; })); }} className="px-2 py-1 text-gray-400 hover:text-red-600 text-sm">&#10005;</button>
        </div>);
      })}</div>
      <div className="flex gap-2">
        <input value={neuTartLabel} onChange={function(e) { setNeuTartLabel(e.target.value); }} onKeyDown={function(e) { if (e.key === "Enter" && neuTartLabel.trim()) { setTerminarten(terminarten.concat([{ id: slug(neuTartLabel), label: neuTartLabel.trim() }])); setNeuTartLabel(""); } }} placeholder="Neue Terminart" className={feldKlasse} />
        <button onClick={function() { if (!neuTartLabel.trim()) return; var id = slug(neuTartLabel); if (terminarten.some(function(t) { return t.id === id; })) { alert("Diese Terminart gibt es schon."); return; } setTerminarten(terminarten.concat([{ id: id, label: neuTartLabel.trim() }])); setNeuTartLabel(""); }} className={addBtn}>+ Hinzufügen</button>
      </div>
    </div>

    {/* Mitgliedschaften (Hauptauswahl) */}
    <StringListe titel="Mitgliedschaften" hinweis="Hauptauswahl im Abschluss-Wizard. Rehasport, FPZ und T-Rena erhalten automatisch den Zuzahlungs-Schritt; EMS überspringt die Zubuchungen."
      list={haupt} setter={setHaupt} neu={neuHaupt} setNeu={setNeuHaupt} placeholder="z. B. 6 Monate" />

    {/* Zubuchungen */}
    <StringListe titel="Zubuchungen" hinweis="Kombinierbar zu einer Mitgliedschaft. Bei Rehasport/FPZ/T-Rena werden EMS und Power Plate automatisch ausgeblendet."
      list={zubuchungen} setter={setZubuchungen} neu={neuZub} setNeu={setNeuZub} placeholder="z. B. Solarium-Flat" />

    {/* Präventionskurse */}
    <StringListe titel="Präventionskurse" hinweis={"Konkrete Kurse zur Auswahl, wenn die Mitgliedschaft \"Präventionskurs\" gewählt wird. Fließen in die Wellpass-Präventions-Quote ein."}
      list={praevKurse} setter={setPraevKurse} neu={neuKurs} setNeu={setNeuKurs} placeholder="z. B. AOK-Rückenkurs" />

    <div className="flex items-center gap-3 sticky bottom-0 bg-gray-50 py-3 -mx-1 px-1 border-t border-gray-100">
      <button onClick={speichern} disabled={busy} className="px-5 py-2.5 bg-[#0F8A5F] hover:bg-[#13A874] disabled:bg-gray-300 text-white text-sm font-bold rounded-lg">{busy ? "Speichern..." : "Beratungs-Konfiguration speichern"}</button>
      {saved && <span className="text-sm text-emerald-600 font-bold">✓ Gespeichert</span>}
      <button onClick={function() { setWerbequellen(BERATUNG_WERBEQUELLEN.slice()); setTerminarten(BERATUNG_TERMINARTEN.map(function(t) { return Object.assign({}, t); })); setHaupt(BERATUNG_HAUPT.slice()); setZubuchungen(BERATUNG_ZUBUCHUNGEN.slice()); setPraevKurse(BERATUNG_PRAEV_KURSE.slice()); }} className="ml-auto px-3 py-2 text-xs text-gray-500 hover:text-gray-800">Zurücksetzen</button>
    </div>
  </div>);
}

// Reihenfolge der Erfolge je Studio. Leitung/Admin/Geschäftsführung legen damit
// fest, in welcher Reihenfolge die Trainer die Erfolge im Erfassen-Screen sehen —
// innerhalb der Kategorie und, per "ganz oben", auch außerhalb davon.
function ReihenfolgeView({ trainer, produkte, verfuegbarkeit, setVerfuegbarkeit, kategorien }) {
  const studio = trainer.studio;
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const aktive = getStudioProdukte(produkte, verfuegbarkeit, studio);
  const katNames = (kategorien && kategorien.length > 0) ? kategorien.map(function(k) { return k.name; }) : KATEGORIEN_FALLBACK;
  const aktivitaeten = sortStudioProdukte(aktive.filter(function(p) { return p.ist_aktivitaet; }));
  const verkaufsItems = aktive.filter(function(p) { return !p.ist_aktivitaet; });
  const obenItems = sortStudioProdukte(verkaufsItems.filter(function(p) { return p._ganzOben; }));
  const restItems = verkaufsItems.filter(function(p) { return !p._ganzOben; });
  const gruppen = katNames.map(function(k) { return { k: k, items: sortStudioProdukte(restItems.filter(function(p) { return p.kategorie === k; })) }; }).filter(function(g) { return g.items.length > 0; });

  // Schreibt komplette Listen neu durch (10, 20, 30 …). Dadurch sind die Werte
  // nach jedem Verschieben eindeutig, egal wie der Ausgangszustand war.
  const writeOrder = async function(listen) {
    setErr("");
    setBusy(true);
    var updates = [];
    listen.forEach(function(l) {
      l.items.forEach(function(p, i) {
        updates.push({ produkt_id: p.id, sortierung: (i + 1) * 10, ganz_oben: !!l.ganzOben });
      });
    });
    for (var i = 0; i < updates.length; i++) {
      var u = updates[i];
      var res = await sb.from("produkt_verfuegbarkeit")
        .update({ sortierung: u.sortierung, ganz_oben: u.ganz_oben })
        .eq("produkt_id", u.produkt_id).eq("studio", studio);
      if (res.error) {
        setErr("Speichern fehlgeschlagen: " + res.error.message + " — ist die SQL-Migration schon eingespielt?");
        setBusy(false);
        return;
      }
    }
    setVerfuegbarkeit(function(prev) {
      return prev.map(function(v) {
        if (v.studio !== studio) return v;
        var u = updates.find(function(x) { return x.produkt_id === v.produkt_id; });
        return u ? Object.assign({}, v, { sortierung: u.sortierung, ganz_oben: u.ganz_oben }) : v;
      });
    });
    setBusy(false);
  };

  const move = function(items, index, delta, ganzOben) {
    var ziel = index + delta;
    if (ziel < 0 || ziel >= items.length) return;
    var neu = items.slice();
    var tmp = neu[index]; neu[index] = neu[ziel]; neu[ziel] = tmp;
    writeOrder([{ items: neu, ganzOben: ganzOben }]);
  };

  const toTop = function(items, index, ganzOben) {
    if (index === 0) return;
    var neu = items.slice();
    var p = neu.splice(index, 1)[0];
    neu.unshift(p);
    writeOrder([{ items: neu, ganzOben: ganzOben }]);
  };

  // Aus der Kategorie herausziehen: Produkt wandert in den "ganz oben"-Block.
  const pin = function(p) {
    var kat = gruppen.find(function(g) { return g.k === p.kategorie; });
    var restKat = kat ? kat.items.filter(function(x) { return x.id !== p.id; }) : [];
    writeOrder([
      { items: [p].concat(obenItems), ganzOben: true },
      { items: restKat, ganzOben: false }
    ]);
  };

  // Zurück in die eigene Kategorie (ans Ende).
  const unpin = function(p) {
    var kat = gruppen.find(function(g) { return g.k === p.kategorie; });
    var katItems = (kat ? kat.items : []).concat([p]);
    writeOrder([
      { items: obenItems.filter(function(x) { return x.id !== p.id; }), ganzOben: true },
      { items: katItems, ganzOben: false }
    ]);
  };

  const Zeile = function(props2) {
    var p = props2.p, i = props2.i, items = props2.items, ganzOben = props2.ganzOben;
    var btn = "w-7 h-7 rounded border border-gray-200 text-gray-500 hover:text-emerald-600 hover:border-emerald-400 disabled:opacity-25 disabled:hover:text-gray-500 disabled:hover:border-gray-200";
    return (<div className="flex items-center justify-between px-3 py-2 bg-white border border-gray-200 rounded-lg">
      <div className="flex items-center gap-2 min-w-0">
        <span className="text-xs text-gray-300 w-5 flex-shrink-0">{i + 1}.</span>
        <span className="text-sm text-gray-800 truncate">{p.name}</span>
        {ganzOben && <span className="text-[10px] text-gray-400 flex-shrink-0">aus {p.kategorie}</span>}
      </div>
      <div className="flex items-center gap-1 flex-shrink-0">
        <button disabled={busy || i === 0} onClick={function() { move(items, i, -1, ganzOben); }} title="Nach oben" className={btn}>&#9650;</button>
        <button disabled={busy || i === items.length - 1} onClick={function() { move(items, i, 1, ganzOben); }} title="Nach unten" className={btn}>&#9660;</button>
        <button disabled={busy || i === 0} onClick={function() { toTop(items, i, ganzOben); }} title="An die Spitze dieser Liste" className={btn}>&#8648;</button>
        {props2.pinBar}
      </div>
    </div>);
  };

  return (<div className="max-w-2xl mx-auto p-4">
    <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Reihenfolge der Erfolge · {studio}</div>
    <p className="text-xs text-gray-500 mb-4">So sehen die Trainer dieses Studios die Auswahl beim Erfassen. Die Reihenfolge gilt nur für {studio} — andere Studios bleiben unberührt.</p>

    {err && <div className="mb-3 p-2 bg-red-50 border border-red-200 rounded text-xs text-red-700">{err}</div>}
    {busy && <div className="mb-3 p-2 bg-gray-50 border border-gray-200 rounded text-xs text-gray-500">Speichere …</div>}

    {aktivitaeten.length > 0 && (<div className="mb-5">
      <div className="text-xs font-bold text-blue-600 uppercase tracking-wider mb-2">Aktivitäten (stehen beim Erfassen ganz oben)</div>
      <div className="space-y-1">{aktivitaeten.map(function(p, i) { return <Zeile key={p.id} p={p} i={i} items={aktivitaeten} ganzOben={false} pinBar={null} />; })}</div>
      <p className="text-[11px] text-gray-400 mt-1.5">Aktivitäten bilden beim Erfassen den ersten Block — sie lassen sich nur untereinander sortieren.</p>
    </div>)}

    <div className="mb-5">
      <div className="text-xs font-bold text-emerald-700 uppercase tracking-wider mb-2">Ganz oben (direkt unter den Aktivitäten)</div>
      {obenItems.length === 0 ? (
        <div className="px-3 py-3 border border-dashed border-gray-300 rounded-lg text-xs text-gray-400">Noch nichts nach oben gezogen. Mit &#8593; bei einem Erfolg weiter unten holst du ihn hierher — z.B. die Zubuchung Intensivbetreuung.</div>
      ) : (
        <div className="space-y-1">{obenItems.map(function(p, i) { return <Zeile key={p.id} p={p} i={i} items={obenItems} ganzOben={true}
          pinBar={<button disabled={busy} onClick={function() { unpin(p); }} title={"Zurück in Kategorie " + p.kategorie} className="w-7 h-7 rounded border border-gray-200 text-gray-500 hover:text-amber-600 hover:border-amber-400 disabled:opacity-25">&#8595;</button>} />; })}</div>
      )}
    </div>

    {gruppen.map(function(g) { return (<div key={g.k} className="mb-5">
      <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">{g.k}</div>
      <div className="space-y-1">{g.items.map(function(p, i) { return <Zeile key={p.id} p={p} i={i} items={g.items} ganzOben={false}
        pinBar={<button disabled={busy} onClick={function() { pin(p); }} title="Aus der Kategorie holen und ganz oben anzeigen" className="w-7 h-7 rounded border border-gray-200 text-gray-500 hover:text-emerald-600 hover:border-emerald-400 disabled:opacity-25">&#8593;</button>} />; })}</div>
    </div>); })}

    <div className="mt-6 p-3 bg-blue-50 border border-blue-200 rounded-lg text-xs text-blue-700">
      <div className="font-bold mb-1">Hinweis</div>
      <div>&#9650;/&#9660; verschiebt innerhalb der Liste, &#8648; setzt an die Spitze. Mit &#8593; verlässt ein Erfolg seine Kategorie und steht bei den Trainern ganz oben; mit &#8595; geht er zurück.</div>
    </div>
  </div>);
}

function PersonalisierenView(props) {
  const [sub, setSub] = useState("produkte");
  const istBeratung = darfBeratung(props.trainer);
  const navItems = [
    { id: "produkte", l: "Produkte" },
    { id: "reihenfolge", l: "Reihenfolge" },
    { id: "kategorien", l: "Kategorien" },
    { id: "terminarten", l: "Terminarten" }
  ].concat([]); // Beratungs-Config deaktiviert; zum Reaktivieren: .concat(istBeratung ? [{ id: "beratung", l: "Beratung" }] : [])

  return (<div>
    <div className="max-w-3xl mx-auto px-4 pt-4">
      <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Personalisieren</div>
      <div className="flex flex-wrap gap-1.5 mb-1 bg-white border border-gray-200 rounded-lg p-1.5">
        {navItems.map(function(n) {
          var active = sub === n.id;
          return (<button key={n.id} onClick={function() { setSub(n.id); }} className={"px-4 py-2 rounded-md text-sm font-medium transition-colors " + (active ? "bg-emerald-600 text-white" : "text-gray-500 hover:text-gray-800 hover:bg-gray-50")}>{n.l}</button>);
        })}
      </div>
    </div>

    {sub === "produkte" && <ProdukteView trainer={props.trainer} produkte={props.produkte} setProdukte={props.setProdukte} verfuegbarkeit={props.verfuegbarkeit} setVerfuegbarkeit={props.setVerfuegbarkeit} kategorien={props.kategorien} erfolge={props.erfolge} setErfolge={props.setErfolge} />}
    {sub === "reihenfolge" && <ReihenfolgeView trainer={props.trainer} produkte={props.produkte} verfuegbarkeit={props.verfuegbarkeit} setVerfuegbarkeit={props.setVerfuegbarkeit} kategorien={props.kategorien} />}
    {sub === "kategorien" && <KategorienView kategorien={props.kategorien} setKategorien={props.setKategorien} produkte={props.produkte} setProdukte={props.setProdukte} />}
    {sub === "terminarten" && <TerminartenView terminarten={props.terminarten} setTerminarten={props.setTerminarten} erfolge={props.erfolge} setErfolge={props.setErfolge} trainer={props.trainer} />}
    {sub === "beratung" && istBeratung && <div className="max-w-3xl mx-auto px-4 pb-4"><BeratungConfigEditor setConfigVersion={props.setConfigVersion} /></div>}
  </div>);
}

function ProdukteView({ trainer, produkte, setProdukte, verfuegbarkeit, setVerfuegbarkeit, kategorien, erfolge, setErfolge }) {
  const katNames = (kategorien && kategorien.length > 0) ? kategorien.map(function(k) { return k.name; }) : KATEGORIEN_FALLBACK;
  const defaultKat = katNames[0];
  const [edit, setEdit] = useState(null);
  const [form, setForm] = useState({ name: "", preis: 0, einheit: "€", kategorie: defaultKat, studios: [], ist_aktivitaet: false });
  const [filter, setFilter] = useState("eigenes"); // "eigenes" | "alle"
  const [deleting, setDeleting] = useState(null); // produkt_id während Löschvorgang
  const isAdmin = trainer.rolle === "admin";

  const startAdd = function() {
    // Default: nur eigenes Studio vorausgewählt
    setForm({ name: "", preis: 0, einheit: "€", kategorie: defaultKat, studios: [trainer.studio], ist_aktivitaet: false });
    setEdit("new");
  };
  const startEdit = function(p) {
    setForm({ name: p.name, preis: p.preis, einheit: p.einheit, kategorie: p.kategorie, id: p.id, studios: getProduktStudios(verfuegbarkeit, p.id), ist_aktivitaet: p.ist_aktivitaet === true });
    setEdit(p.id);
  };
  const toggleStudio = function(s) {
    setForm(function(f) {
      const has = f.studios.includes(s);
      return Object.assign({}, f, { studios: has ? f.studios.filter(function(x) { return x !== s; }) : f.studios.concat([s]) });
    });
  };

  const save = async function() {
    if (!form.name.trim()) return;
    if (form.studios.length === 0) { alert("Bitte mindestens ein Studio auswählen."); return; }
    if (edit === "new") {
      const np = { id: "p" + Date.now(), name: form.name.trim(), preis: form.ist_aktivitaet ? 0 : form.preis, einheit: form.einheit, kategorie: form.kategorie, aktiv: true, ist_aktivitaet: !!form.ist_aktivitaet, erstellt_von_studio: trainer.studio };
      await sb.from("produkte").insert([np]);
      const vRows = form.studios.map(function(s) { return { produkt_id: np.id, studio: s }; });
      await sb.from("produkt_verfuegbarkeit").insert(vRows);
      setProdukte(function(prev) { return prev.concat([np]); });
      setVerfuegbarkeit(function(prev) { return prev.concat(vRows); });
    } else {
      // Produkt-Felder updaten
      const patch = { name: form.name.trim(), preis: form.ist_aktivitaet ? 0 : form.preis, einheit: form.einheit, kategorie: form.kategorie, ist_aktivitaet: !!form.ist_aktivitaet };
      await sb.from("produkte").update(patch).eq("id", edit);
      setProdukte(function(prev) { return prev.map(function(p) { return p.id === edit ? Object.assign({}, p, patch) : p; }); });
      // Verfügbarkeit syncen: alte raus, neue rein
      const oldStudios = getProduktStudios(verfuegbarkeit, edit);
      const toRemove = oldStudios.filter(function(s) { return !form.studios.includes(s); });
      const toAdd = form.studios.filter(function(s) { return !oldStudios.includes(s); });
      if (toRemove.length) {
        await sb.from("produkt_verfuegbarkeit").delete().eq("produkt_id", edit).in("studio", toRemove);
      }
      if (toAdd.length) {
        const newRows = toAdd.map(function(s) { return { produkt_id: edit, studio: s }; });
        await sb.from("produkt_verfuegbarkeit").insert(newRows);
      }
      setVerfuegbarkeit(function(prev) {
        const filtered = prev.filter(function(v) { return !(v.produkt_id === edit && toRemove.includes(v.studio)); });
        return filtered.concat(toAdd.map(function(s) { return { produkt_id: edit, studio: s }; }));
      });
    }
    setEdit(null);
  };

  // Soft-Delete: aktiv = false. Reaktivieren möglich.
  const toggleAktiv = async function(id) {
    const p = produkte.find(function(x) { return x.id === id; });
    await sb.from("produkte").update({ aktiv: !p.aktiv }).eq("id", id);
    setProdukte(function(prev) { return prev.map(function(x) { return x.id === id ? Object.assign({}, x, { aktiv: !x.aktiv }) : x; }); });
  };

  // Hard-Delete: nur Admin. Erfolge-Snapshots werden auf "Gelöscht"-Produkt umgehängt,
  // damit historische Statistiken erhalten bleiben (standardmäßig ausgeblendet).
  const hardDelete = async function(p) {
    if (!isAdmin) return;
    if (p.id === DELETED_PRODUKT_ID) { alert("Das Spezial-Produkt 'Gelöscht' kann nicht gelöscht werden."); return; }

    // Anzahl betroffener Erfolge zählen für Hinweis
    var affected = 0;
    erfolge.forEach(function(e) {
      if (Array.isArray(e.verkauft) && e.verkauft.some(function(v) { return v.id === p.id; })) affected++;
    });

    var msg = "Produkt '" + p.name + "' endgültig löschen?";
    if (affected > 0) {
      msg += "\n\n" + affected + " Erfolg(e) referenzieren dieses Produkt. Die Verkäufe werden auf das Sammel-Produkt 'Gelöscht' umgehängt und sind in Statistiken standardmäßig ausgeblendet.";
    }
    msg += "\n\nDieser Schritt kann nicht rückgängig gemacht werden.";

    if (!confirm(msg)) return;
    setDeleting(p.id);

    try {
      // Erfolge mit Snapshot-Eintrag dieses Produkts: verkauft-Array umschreiben
      // ID wird auf p_geloescht umgehängt (für Filter-Logik), Name behält Original mit "(gelöscht)"-Suffix.
      const affectedErfolge = erfolge.filter(function(e) {
        return Array.isArray(e.verkauft) && e.verkauft.some(function(v) { return v.id === p.id; });
      });
      for (var i = 0; i < affectedErfolge.length; i++) {
        var e = affectedErfolge[i];
        var newVerkauft = e.verkauft.map(function(v) {
          if (v.id !== p.id) return v;
          var origName = v.name || p.name;
          // Idempotent: kein doppeltes "(gelöscht)" anhängen
          var newName = origName.endsWith("(gelöscht)") ? origName : origName + " (gelöscht)";
          return { id: DELETED_PRODUKT_ID, name: newName, preis: Number(v.preis) || 0 };
        });
        const upd = await sb.from("erfolge").update({ verkauft: newVerkauft }).eq("id", e.id);
        if (upd.error) throw upd.error;
      }

      // Verfügbarkeiten löschen (FK-Cleanup)
      const delV = await sb.from("produkt_verfuegbarkeit").delete().eq("produkt_id", p.id);
      if (delV.error) throw delV.error;

      // Produkt löschen
      const delP = await sb.from("produkte").delete().eq("id", p.id);
      if (delP.error) throw delP.error;

      // Lokalen State aktualisieren
      setProdukte(function(prev) { return prev.filter(function(x) { return x.id !== p.id; }); });
      setVerfuegbarkeit(function(prev) { return prev.filter(function(v) { return v.produkt_id !== p.id; }); });
      if (setErfolge) {
        setErfolge(function(prev) { return prev.map(function(e) {
          if (!Array.isArray(e.verkauft) || !e.verkauft.some(function(v) { return v.id === p.id; })) return e;
          return Object.assign({}, e, { verkauft: e.verkauft.map(function(v) {
            if (v.id !== p.id) return v;
            var origName = v.name || p.name;
            var newName = origName.endsWith("(gelöscht)") ? origName : origName + " (gelöscht)";
            return { id: DELETED_PRODUKT_ID, name: newName, preis: Number(v.preis) || 0 };
          }) });
        }); });
      }
    } catch (err) {
      alert("Fehler beim Löschen: " + (err.message || JSON.stringify(err)));
    } finally {
      setDeleting(null);
    }
  };

  // Filter: "eigenes" zeigt nur Produkte, die in trainer.studio verfügbar sind. "alle" zeigt alle.
  // Spezial-Produkt "Gelöscht" wird in der Produkt-Verwaltung NIE angezeigt.
  const sichtbar = produkte.filter(function(p) { return p.id !== DELETED_PRODUKT_ID; });
  const visible = filter === "eigenes"
    ? sichtbar.filter(function(p) { return getProduktStudios(verfuegbarkeit, p.id).includes(trainer.studio); })
    : sichtbar;
  const grouped = katNames.map(function(k) { return { k: k, items: visible.filter(function(p) { return p.kategorie === k; }).slice().sort(function(a, b) { return (a.name || "").localeCompare(b.name || "", "de"); }) }; }).filter(function(g) { return g.items.length > 0; });

  return (<div className="max-w-3xl mx-auto p-4">
    <div className="flex items-center justify-between mb-4"><div className="text-xs font-bold text-gray-400 uppercase tracking-wider">Produkte konfigurieren</div><button onClick={startAdd} className="px-3 py-1.5 bg-[#0F8A5F] hover:bg-[#13A874] text-white text-xs font-bold rounded-lg">+ Produkt</button></div>

    <div className="flex gap-1 mb-4">
      <button onClick={function() { setFilter("eigenes"); }} className={"px-3 py-1.5 rounded-full text-xs font-medium transition-colors " + (filter === "eigenes" ? "bg-emerald-600 text-white" : "bg-gray-100 text-gray-600 hover:bg-gray-200")}>{trainer.studio}</button>
      <button onClick={function() { setFilter("alle"); }} className={"px-3 py-1.5 rounded-full text-xs font-medium transition-colors " + (filter === "alle" ? "bg-emerald-600 text-white" : "bg-gray-100 text-gray-600 hover:bg-gray-200")}>Alle Studios</button>
    </div>

    {edit === "new" && (<div className="mb-4 p-4 bg-white border border-emerald-300 rounded-lg space-y-3">
      <div className="text-xs font-bold text-emerald-700 uppercase">Neues Produkt</div>
      <div className="grid grid-cols-2 gap-3">
        <div><label className="text-xs text-gray-500">Name</label><input value={form.name} onChange={function(e) { setForm(Object.assign({}, form, { name: e.target.value })); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none" /></div>
        <div><label className="text-xs text-gray-500">Kategorie</label><select value={form.kategorie} onChange={function(e) { setForm(Object.assign({}, form, { kategorie: e.target.value })); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white">{katNames.map(function(k) { return <option key={k}>{k}</option>; })}</select></div>
        <div><label className="text-xs text-gray-500">Preis</label><input type="number" step="0.01" value={form.preis} onChange={function(e) { setForm(Object.assign({}, form, { preis: parseFloat(e.target.value) || 0 })); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none" /></div>
        <div><label className="text-xs text-gray-500">Einheit</label><select value={form.einheit} onChange={function(e) { setForm(Object.assign({}, form, { einheit: e.target.value })); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white"><option value="€">€ (einmalig)</option><option value="€/Monat">€/Monat</option><option value="€/Woche">€/Woche</option></select></div>
      </div>
      <div>
        <label className="text-xs text-gray-500 block mb-2">Verfügbar in Studios</label>
        <div className="flex flex-wrap gap-2">
          {STUDIOS.map(function(s) { var on = form.studios.includes(s); return (
            <button key={s} onClick={function() { toggleStudio(s); }} className={"px-3 py-1.5 rounded-full text-xs font-medium transition-colors border " + (on ? "bg-emerald-50 border-emerald-300 text-emerald-700" : "bg-white border-gray-200 text-gray-500")}>
              {on ? "✓ " : ""}{s}
            </button>); })}
        </div>
        {form.studios.length === 0 && <div className="text-xs text-red-500 mt-1">Mindestens ein Studio auswählen</div>}
      </div>
      <label className="flex items-start gap-2 text-xs text-gray-600 cursor-pointer">
        <input type="checkbox" checked={!!form.ist_aktivitaet} onChange={function(e) { setForm(Object.assign({}, form, { ist_aktivitaet: e.target.checked })); }} className="mt-0.5 cursor-pointer" />
        <span>Aktivität (kein Verkauf, nur Markierung) — erscheint beim Erfassen im blauen Block unten, zählt nicht in den Umsatz. Z.B. „Folgetermin vereinbart“ oder „Seminareintragung“.</span>
      </label>
      <div className="flex gap-2"><button onClick={save} className="px-4 py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg">Speichern</button><button onClick={function() { setEdit(null); }} className="px-4 py-2 bg-gray-200 text-gray-700 text-xs font-bold rounded-lg">Abbrechen</button></div>
    </div>)}

    {grouped.length === 0 && <div className="text-center py-8 text-gray-400 text-sm">Keine Produkte {filter === "eigenes" ? "in " + trainer.studio : "im System"}.</div>}
