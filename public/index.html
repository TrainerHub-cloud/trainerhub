    {/* Drilldown Zusätze pro Laufzeit (Mehrfachauswahl) */}
    <div className="bg-white border border-gray-200 rounded-lg p-4">
      <div className="text-sm font-bold text-gray-700 mb-2">Zusatz-Quoten innerhalb einer oder mehrerer Laufzeiten</div>
      {(function() {
        var fpAlleDrin = BERATUNG_FITNESSPARK.every(function(l) { return drilldownLaufzeiten.includes(l); });
        var toggleEinzel = function(l) {
          setDrilldownLaufzeiten(function(prev) {
            return prev.includes(l) ? prev.filter(function(x) { return x !== l; }) : prev.concat([l]);
          });
        };
        var toggleFitnessPark = function() {
          setDrilldownLaufzeiten(function(prev) {
            if (BERATUNG_FITNESSPARK.every(function(l) { return prev.includes(l); })) {
              // alle FP entfernen
              return prev.filter(function(x) { return BERATUNG_FITNESSPARK.indexOf(x) === -1; });
            }
            // fehlende FP ergänzen
            var copy = prev.slice();
            BERATUNG_FITNESSPARK.forEach(function(l) { if (copy.indexOf(l) === -1) copy.push(l); });
            return copy;
          });
        };
        return (<div className="mb-3">
          {/* Direkt-Variante: Fitness Park Mitgliedschaft */}
          <button onClick={toggleFitnessPark} className={"px-3 py-1.5 rounded-lg text-sm font-medium border transition-colors mb-2 " + (fpAlleDrin ? "border-emerald-500 bg-emerald-600 text-white" : "border-emerald-300 bg-emerald-50 text-emerald-700 hover:bg-emerald-100")}>
            Fitness Park Mitgliedschaft <span className="opacity-70 font-normal">(1 + 12 + 24 Monate)</span>
          </button>
          {/* Einzelne Laufzeiten */}
          <div className="flex flex-wrap gap-1.5">{BERATUNG_LAUFZEITEN.map(function(l) {
            var active = drilldownLaufzeiten.includes(l);
            return (<button key={l} onClick={function() { toggleEinzel(l); }} className={"px-2.5 py-1 rounded-md text-xs border transition-colors " + (active ? "border-emerald-500 bg-emerald-100 text-emerald-800 font-medium" : "border-gray-200 bg-white text-gray-500 hover:border-gray-300")}>{l}</button>);
          })}</div>
          {drilldownLaufzeiten.length > 1 && <button onClick={function() { setDrilldownLaufzeiten([]); }} className="mt-2 text-xs text-gray-400 hover:text-gray-700">Auswahl leeren</button>}
        </div>);
      })()}
      <div className="text-xs text-gray-400 mb-3">
        {drilldownLaufzeiten.length === 0
          ? "Bitte mindestens eine Laufzeit auswählen."
          : "Von " + drill.ges + " Abschlüssen mit " + (drilldownLaufzeiten.length === 1 ? "\"" + drilldownLaufzeiten[0] + "\"" : drilldownLaufzeiten.length + " gewählten Laufzeiten") + " wurden folgende Zusätze kombiniert:"}
      </div>
      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">{drill.zusatz.map(function(z) {
        return (<div key={z.zusatz} className="border border-gray-100 rounded-lg p-3 text-center">
          <div className="text-xs text-gray-500">{z.zusatz}</div>
          <div className="text-xl font-black text-gray-800 mt-1">{z.pct} %</div>
          <div className="text-xs text-gray-400">{z.anz} von {drill.ges}</div>
        </div>);
      })}</div>
      {drilldownLaufzeiten.length > 0 && drill.ges === 0 && <div className="text-sm text-gray-400 py-4 text-center">Keine Abschlüsse mit dieser Auswahl im aktuellen Filter.</div>}
    </div>
  </div>);
}

function BerichteBeratungView({ trainer, users, beratungen }) {
  const isAdmin = trainer.rolle === "admin";
  const today = new Date();
  const [year, setYear] = useState(today.getFullYear());
  const [month, setMonth] = useState(today.getMonth() + 1);
  const [studioSel, setStudioSel] = useState(isAdmin ? "alle" : trainer.studio);
  const [mitarbeiterSel, setMitarbeiterSel] = useState("alle");
  const [nurAbschluss, setNurAbschluss] = useState(false);
  const [inclGesamt, setInclGesamt] = useState(true);
  const [inclDetail, setInclDetail] = useState(true);
  const [inclMitarbeiter, setInclMitarbeiter] = useState(true);
  const [inclQuellen, setInclQuellen] = useState(true);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const monthLabels = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  const yearOptions = [];
  for (var y = today.getFullYear(); y >= today.getFullYear() - 2; y--) yearOptions.push(y);

  const generate = async function() {
    setErr(""); setBusy(true);
    try {
      var von = new Date(year, month - 1, 1, 0, 0, 0);
      var bis = new Date(year, month, 0, 23, 59, 59);
      var scoped = isAdmin ? beratungen : beratungen.filter(function(b) { return b.studio === trainer.studio; });
      var data = scoped.filter(function(b) {
        var d = new Date(b.datum);
        if (d < von || d > bis) return false;
        if (studioSel !== "alle" && b.studio !== studioSel) return false;
        if (mitarbeiterSel !== "alle" && (b.berater_id || b.berater) !== mitarbeiterSel) return false;
        if (nurAbschluss && !b.abschluss) return false;
        return true;
      }).sort(function(a, b) { return new Date(a.datum) - new Date(b.datum); });

      if (data.length === 0) { setErr("Keine Beratungen im gewählten Zeitraum / Filter."); setBusy(false); return; }

      var wb = XLSX.utils.book_new();

      // Zusammenfassung
      var ges = data.length;
      var abg = data.filter(function(b) { return b.abschluss; }).length;
      var interessenten = new Set(data.map(function(b) { return (b.interessent || "").trim().toLowerCase(); })).size;
      var maName = "Alle Mitarbeiter";
      if (mitarbeiterSel !== "alle") {
        var maObj = users.find(function(u) { return u.id === mitarbeiterSel; });
        maName = maObj ? maObj.name : mitarbeiterSel;
      }
      var rowsSum = [
        ["Berichtszeitraum", monthLabels[month - 1] + " " + year],
        ["Studio", studioSel === "alle" ? "Alle Studios" : studioSel],
        ["Mitarbeiter", maName],
        ["Filter", nurAbschluss ? "Nur Termine mit Abschluss" : "Alle Termine"],
        ["", ""],
        ["Gespräche gesamt", ges],
        ["Eindeutige Interessenten", interessenten],
        ["Abschlüsse", abg],
        ["Abschlussquote %", ges > 0 ? Number((abg / ges * 100).toFixed(1)) : 0]
      ];
      var wsSum = XLSX.utils.aoa_to_sheet(rowsSum);
      wsSum["!cols"] = [{wch:28},{wch:24}];
      XLSX.utils.book_append_sheet(wb, wsSum, "Zusammenfassung");

      // Gesamtbericht: alle Abschlüsse als breite Tabelle mit Spalten pro Mitgliedschaft.
      // Eine Spalte je Mitgliedschaft -> "Ja" wenn vorhanden, sonst leer.
      if (inclGesamt) {
        var abgList = data.filter(function(b) { return b.abschluss; });
        var head = ["Datum", "Studio", "Berater", "Interessent", "Terminart", "Werbequelle(n)"];
        head = head.concat(BERATUNG_MITGLIEDSCHAFTEN);
        var rowsG = [head];
        abgList.forEach(function(b) {
          var row = [
            new Date(b.datum).toLocaleDateString("de-DE"),
            b.studio || "",
            b.berater || "",
            b.interessent || "",
            beratungTartLabel(b.terminart),
            (b.werbequellen || []).join(", ")
          ];
          BERATUNG_MITGLIEDSCHAFTEN.forEach(function(m) {
            row.push((b.mitgliedschaften || []).includes(m) ? "X" : "");
          });
          rowsG.push(row);
        });
        // Summenzeile
        if (abgList.length > 0) {
          var sumRow = ["", "", "", "", "", "Summe:"];
          BERATUNG_MITGLIEDSCHAFTEN.forEach(function(m) {
            var n = abgList.filter(function(b) { return (b.mitgliedschaften || []).includes(m); }).length;
            sumRow.push(n > 0 ? n : "");
          });
          rowsG.push([]);
          rowsG.push(sumRow);
        }
        var wsG = XLSX.utils.aoa_to_sheet(rowsG);
        var colsG = [{wch:11},{wch:12},{wch:18},{wch:22},{wch:16},{wch:28}];
        BERATUNG_MITGLIEDSCHAFTEN.forEach(function(m) { colsG.push({wch: Math.max(8, m.length + 2)}); });
        wsG["!cols"] = colsG;
        wsG["!freeze"] = { xSplit: "6", ySplit: "1" };
        XLSX.utils.book_append_sheet(wb, wsG, "Gesamtbericht");
      }

      // Detailliste
      if (inclDetail) {
        var rows1 = [["Datum", "Studio", "Berater", "Interessent", "Terminart", "Werbequelle(n)", "Mitgliedschaft(en)", "Abschluss"]];
        data.forEach(function(b) {
          rows1.push([
            new Date(b.datum).toLocaleDateString("de-DE"),
            b.studio || "",
            b.berater || "",
            b.interessent || "",
            beratungTartLabel(b.terminart),
            (b.werbequellen || []).join(", "),
            (b.mitgliedschaften || []).join(", "),
            b.abschluss ? "Ja" : "Nein"
          ]);
        });
        var ws1 = XLSX.utils.aoa_to_sheet(rows1);
        ws1["!cols"] = [{wch:12},{wch:12},{wch:18},{wch:22},{wch:16},{wch:30},{wch:35},{wch:10}];
        XLSX.utils.book_append_sheet(wb, ws1, "Termine");
      }

      // Pro Mitarbeiter
      if (inclMitarbeiter) {
        var byMa = {};
        data.forEach(function(b) {
          var k = b.berater || "?";
          if (!byMa[k]) byMa[k] = { studio: b.studio, ges: 0, abg: 0 };
          byMa[k].ges++; if (b.abschluss) byMa[k].abg++;
        });
        var rows2 = [["Mitarbeiter", "Studio", "Gespräche", "Abschlüsse", "Quote %"]];
        Object.keys(byMa).sort().forEach(function(k) {
          var m = byMa[k];
          rows2.push([k, m.studio, m.ges, m.abg, m.ges > 0 ? Number((m.abg / m.ges * 100).toFixed(1)) : 0]);
        });
        var ws2 = XLSX.utils.aoa_to_sheet(rows2);
        ws2["!cols"] = [{wch:20},{wch:12},{wch:11},{wch:11},{wch:10}];
        XLSX.utils.book_append_sheet(wb, ws2, "Pro Mitarbeiter");
      }

      // Leadquellen
      if (inclQuellen) {
        var byQ = {};
        data.forEach(function(b) {
          (b.werbequellen || []).forEach(function(q) {
            if (!byQ[q]) byQ[q] = { ges: 0, abg: 0 };
            byQ[q].ges++; if (b.abschluss) byQ[q].abg++;
          });
        });
        var rows3 = [["Werbequelle", "Nennungen", "Abschlüsse", "Quote %"]];
        Object.keys(byQ).sort(function(a, b) { return byQ[b].ges - byQ[a].ges; }).forEach(function(q) {
          var m = byQ[q];
          rows3.push([q, m.ges, m.abg, m.ges > 0 ? Number((m.abg / m.ges * 100).toFixed(1)) : 0]);
        });
        var ws3 = XLSX.utils.aoa_to_sheet(rows3);
        ws3["!cols"] = [{wch:28},{wch:11},{wch:11},{wch:10}];
        XLSX.utils.book_append_sheet(wb, ws3, "Leadquellen");
      }

      var maTag = mitarbeiterSel !== "alle" ? "_" + maName.replace(/[^A-Za-z0-9äöüÄÖÜß]/g, "") : "";
      var fname = "Beratungsbericht_" + (studioSel === "alle" ? "AlleStudios" : studioSel) + maTag + "_" + year + "-" + String(month).padStart(2, "0") + ".xlsx";
      XLSX.writeFile(wb, fname);
    } catch (e) {
      setErr("Fehler beim Erstellen: " + (e.message || JSON.stringify(e)));
    } finally {
      setBusy(false);
    }
  };

  return (<div className="max-w-2xl mx-auto p-4">
    <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Beratungsbericht</div>
    <div className="bg-white border border-gray-200 rounded-lg p-4 space-y-3">
      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="text-xs text-gray-500 uppercase tracking-wider">Monat</label>
          <select value={month} onChange={function(e) { setMonth(parseInt(e.target.value, 10)); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white">
            {monthLabels.map(function(l, i) { return <option key={i+1} value={i+1}>{l}</option>; })}
          </select>
        </div>
        <div>
          <label className="text-xs text-gray-500 uppercase tracking-wider">Jahr</label>
          <select value={year} onChange={function(e) { setYear(parseInt(e.target.value, 10)); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white">
            {yearOptions.map(function(y) { return <option key={y} value={y}>{y}</option>; })}
          </select>
        </div>
      </div>

      {isAdmin && <div>
        <label className="text-xs text-gray-500 uppercase tracking-wider">Studio</label>
        <select value={studioSel} onChange={function(e) { setStudioSel(e.target.value); setMitarbeiterSel("alle"); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white">
          <option value="alle">Alle Studios</option>
          {STUDIOS.map(function(s) { return <option key={s} value={s}>{s}</option>; })}
        </select>
      </div>}
      {!isAdmin && <p className="text-xs text-gray-400">Du erhältst den Bericht für {trainer.studio}.</p>}

      <div>
        <label className="text-xs text-gray-500 uppercase tracking-wider">Mitarbeiter</label>
        <select value={mitarbeiterSel} onChange={function(e) { setMitarbeiterSel(e.target.value); }} className="w-full mt-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:border-emerald-500 focus:outline-none bg-white">
          <option value="alle">Alle Mitarbeiter</option>
          {users.filter(function(u) {
            if (studioSel !== "alle") return u.studio === studioSel;
            if (!isAdmin) return u.studio === trainer.studio;
            return true;
          }).slice().sort(function(a, b) { return (a.name || "").localeCompare(b.name || "", "de"); }).map(function(u) {
            return <option key={u.id} value={u.id}>{u.name} · {u.studio}</option>;
          })}
        </select>
      </div>

      <div className="pt-2 border-t border-gray-100">
        <div className="text-xs text-gray-500 uppercase tracking-wider mb-2">Welche Aspekte sollen rein?</div>
        <div className="space-y-2">
          <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer"><input type="checkbox" checked={nurAbschluss} onChange={function(e) { setNurAbschluss(e.target.checked); }} />Termine ohne Abschluss ausblenden</label>
          <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer"><input type="checkbox" checked={inclGesamt} onChange={function(e) { setInclGesamt(e.target.checked); }} />Gesamtbericht (alle Abschlüsse als Tabelle)</label>
          <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer"><input type="checkbox" checked={inclDetail} onChange={function(e) { setInclDetail(e.target.checked); }} />Detail-Termineliste</label>
          <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer"><input type="checkbox" checked={inclMitarbeiter} onChange={function(e) { setInclMitarbeiter(e.target.checked); }} />Auswertung pro Mitarbeiter</label>
          <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer"><input type="checkbox" checked={inclQuellen} onChange={function(e) { setInclQuellen(e.target.checked); }} />Leadquellen-Auswertung</label>
        </div>
      </div>

      {err && <div className="p-2 bg-red-50 border border-red-200 rounded text-xs text-red-700">{err}</div>}

      <button onClick={generate} disabled={busy} className="w-full py-2.5 bg-[#0F8A5F] hover:bg-[#13A874] disabled:bg-gray-300 text-white text-sm font-bold rounded-lg">
        {busy ? "Wird erstellt..." : "📥 Beratungsbericht als Excel herunterladen"}
      </button>
    </div>
    <div className="mt-6 p-3 bg-blue-50 border border-blue-200 rounded-lg text-xs text-blue-700">
      <div className="font-bold mb-1">Was ist im Bericht enthalten?</div>
      <div>Eine Zusammenfassung mit KPIs (Gespräche, Interessenten, Abschlüsse, Quote). Der Gesamtbericht listet alle Abschlüsse als breite Tabelle mit einer Spalte je Mitgliedschaft (X = gewählt) und einer Summenzeile. Dazu wählbar: Detailliste, Auswertung pro Mitarbeiter und Leadquellen. Über "Termine ohne Abschluss ausblenden" filterst du nur erfolgreiche Termine; mit dem Mitarbeiter-Filter erhältst du den Bericht für eine einzelne Person.</div>
    </div>
  </div>);
}

function App() {
  const [view, setView] = useState("erfolge");
  const [trainer, setTrainer] = useState(null);
  const [aktivesStudio, setAktivesStudio] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const [showProfil, setShowProfil] = useState(false);
  const [users, setUsers] = useState([]);
  const [produkte, setProdukte] = useState([]);
  const [verfuegbarkeit, setVerfuegbarkeit] = useState([]);
  const [erfolge, setErfolge] = useState([]);
  const [ziele, setZiele] = useState([]);
  const [kategorien, setKategorien] = useState([]);
  const [terminarten, setTerminarten] = useState([]);
  const [ready, setReady] = useState(false);
  // Standardmäßig ALLE Daten laden, damit Dashboard, Benchmark und Verläufe
  // sofort vollständig sind (auch für neu angelegte Accounts). Der Toggle im
  // Dashboard kann zur Egress-Schonung auf "letzte 30 Tage" zurückstellen.
  const [erfolgeFullLoad, setErfolgeFullLoad] = useState(true);
  const [erfolgeReloading, setErfolgeReloading] = useState(false);
  const [beratungen, setBeratungen] = useState([]);
  const [beratungFullLoad, setBeratungFullLoad] = useState(true);
  // Zählt hoch, wenn die Beratungs-Listen (Config) geändert werden -> erzwingt Re-Render.
  const [configVersion, setConfigVersion] = useState(0);
  const [beratungReloading, setBeratungReloading] = useState(false);

  // Auth-State: lädt Profil aus users-Tabelle für aktuellen Auth-User
  const loadProfile = async function(authUser) {
    if (!authUser) { setTrainer(null); setAktivesStudio(null); return; }
    const res = await sb.from("users").select("*").eq("id", authUser.id).single();
    if (res.data) {
      // Geschäftsführung verhält sich überall wie Admin; echte Rolle bleibt in rolle_echt erhalten.
      var rolleEcht = res.data.rolle;
      var rolleEff = rolleEcht === "geschaeftsfuehrung" ? "admin" : rolleEcht;
      const t = { id: res.data.id, name: res.data.name, studio: res.data.studio, rolle: rolleEff, rolle_echt: rolleEcht,
                  beratung_freigabe: res.data.beratung_freigabe === true,
                  studios_freigabe: Array.isArray(res.data.studios_freigabe) ? res.data.studios_freigabe : [] };
      setTrainer(t);
      setAktivesStudio(t.studio); // Default = Heimatstudio
    } else {
      setTrainer(null);
      sb.auth.signOut();
    }
  };

  // Beim Mount: aktuellen Session-Status prüfen + Listener registrieren
  useEffect(function() {
    sb.auth.getSession().then(function(res) {
      const session = res.data.session;
      if (session) loadProfile(session.user);
      setAuthChecked(true);
    });
    const { data: listener } = sb.auth.onAuthStateChange(function(event, session) {
      if (session) loadProfile(session.user);
      else { setTrainer(null); setAktivesStudio(null); }
    });
    return function() { listener.subscription.unsubscribe(); };
  }, []);

  // Daten laden, sobald Trainer eingeloggt ist (vorher würde RLS blockieren)
  // Erfolge: standardmäßig nur letzte 30 Tage (Egress-Optimierung).
  // Vollladung über Toggle in Dashboard/Erfolge-Historie.
  useEffect(function() {
    if (!trainer) { setReady(false); return; }
    var thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();
    var erfolgeQuery = erfolgeFullLoad
      ? sb.from("erfolge").select("*")
      : sb.from("erfolge").select("*").gte("datum", thirtyDaysAgo);
    var darfBer = darfBeratung(trainer);
    var beratungQuery = darfBer
      ? (beratungFullLoad ? sb.from("beratung").select("*") : sb.from("beratung").select("*").gte("datum", thirtyDaysAgo))
      : Promise.resolve({ data: [] });
    Promise.all([
      sb.from("users").select("*"),
      sb.from("produkte").select("*"),
      erfolgeQuery,
      sb.from("ziele").select("*"),
      sb.from("produkt_verfuegbarkeit").select("*"),
      sb.from("kategorien").select("*"),
      sb.from("terminarten").select("*"),
      beratungQuery,
      darfBer ? sb.from("beratung_config").select("*").limit(1) : Promise.resolve({ data: [] })
    ]).then(function(results) {
      if (results[0].data) setUsers(results[0].data);
      if (results[1].data) setProdukte(results[1].data);
      if (results[2].data) setErfolge(results[2].data);
      if (results[3].data) setZiele(results[3].data);
      if (results[4].data) setVerfuegbarkeit(results[4].data);
      if (results[5].data) setKategorien(results[5].data);
      if (results[6].data) setTerminarten(results[6].data);
      if (results[7] && results[7].data) setBeratungen(results[7].data);
      // Beratungs-Config anwenden (überschreibt die Default-Listen). Fehlt die
      // Tabelle/Zeile, bleiben die Code-Defaults aktiv – App läuft trotzdem.
      if (results[8] && results[8].data && results[8].data[0] && results[8].data[0].config) {
        try { setzeBeratungConfig(results[8].data[0].config); setConfigVersion(function(v) { return v + 1; }); } catch (e) {}
      }
      setReady(true);
    });
  }, [trainer, erfolgeFullLoad, beratungFullLoad]);

  const reloadBeratung = function(full) {
    setBeratungReloading(true);
    setBeratungFullLoad(full);
    setTimeout(function() { setBeratungReloading(false); }, 1500);
  };

  // Manueller Reload "Alle Erfolge laden" (Toggle aus Dashboard)
  const reloadErfolge = function(full) {
    setErfolgeReloading(true);
    setErfolgeFullLoad(full);
    // useEffect oben löst automatisch neu aus durch Dependency
    setTimeout(function() { setErfolgeReloading(false); }, 1500);
  };

  // Ohne Studio-Freigabe bleibt das Heimatstudio gesetzt, auch wenn der Zustand
  // aus einer frueheren Sitzung noch ein fremdes Studio enthaelt.
  useEffect(function() {
    if (!trainer || !aktivesStudio) return;
    if (!darfStudio(trainer, aktivesStudio)) setAktivesStudio(trainer.studio);
  }, [trainer, aktivesStudio]);

  const logout = async function() {
    await sb.auth.signOut();
    setTrainer(null);
    setAktivesStudio(null);
    setView("erfolge");
  };

  if (!authChecked) return <div className="min-h-screen bg-[#0C2E27] flex items-center justify-center"><div className="text-[#7FB3A2] text-sm">Lade...</div></div>;
  if (!trainer) return <Login />;
  if (!ready || !aktivesStudio) return <div className="min-h-screen mint flex items-center justify-center"><div className="text-[#A7D9C8] text-sm">Lade Daten...</div></div>;

  // Kontext-Trainer: Heimatstudio bleibt erhalten, aber für Studio-bezogene Operationen nutzen wir aktivesStudio.
  // ctxStudio ist das, was Views als "ihr aktuelles Studio" sehen sollen.
  const ctx = Object.assign({}, trainer, { studio: aktivesStudio });

  return (<div className="min-h-screen mint">
    <Nav view={view} setView={setView} trainer={trainer} aktivesStudio={aktivesStudio} setAktivesStudio={setAktivesStudio} onLogout={logout} onProfilClick={function() { setShowProfil(true); }} />
    {showProfil && <ProfilModal trainer={trainer} onClose={function() { setShowProfil(false); }} />}
    <div className="py-4">
      {view === "erfolge" && <ErfolgeView trainer={trainer} aktivesStudio={aktivesStudio} produkte={produkte} verfuegbarkeit={verfuegbarkeit} erfolge={erfolge} setErfolge={setErfolge} kategorien={kategorien} terminarten={terminarten} users={users} />}
      {view === "dashboard" && <DashboardView trainer={ctx} produkte={produkte} verfuegbarkeit={verfuegbarkeit} erfolge={erfolge} ziele={ziele} kategorien={kategorien} terminarten={terminarten} erfolgeFullLoad={erfolgeFullLoad} reloadErfolge={reloadErfolge} erfolgeReloading={erfolgeReloading} />}
      {view === "beratung" && darfBeratung(trainer) && <BeratungView trainer={trainer} aktivesStudio={aktivesStudio} beratungen={beratungen} setBeratungen={setBeratungen} users={users} />}
      {view === "dashboard_beratung" && darfBeratung(trainer) && <DashboardBeratungView trainer={ctx} beratungen={beratungen} users={users} ziele={ziele} beratungFullLoad={beratungFullLoad} reloadBeratung={reloadBeratung} beratungReloading={beratungReloading} />}
      {view === "berichte_beratung" && darfBeratung(trainer) && <BerichteBeratungView trainer={trainer} users={users} beratungen={beratungen} />}
      {view === "berichte" && <BerichteView trainer={trainer} users={users} erfolge={erfolge} terminarten={terminarten} produkte={produkte} />}
      {view === "team" && (trainer.rolle === "leitung" || trainer.rolle === "admin") && <TeamView trainer={trainer} users={users} setUsers={setUsers} />}
      {view === "personalisieren" && (trainer.rolle === "leitung" || trainer.rolle === "admin") && <PersonalisierenView trainer={ctx} produkte={produkte} setProdukte={setProdukte} verfuegbarkeit={verfuegbarkeit} setVerfuegbarkeit={setVerfuegbarkeit} kategorien={kategorien} setKategorien={setKategorien} terminarten={terminarten} setTerminarten={setTerminarten} erfolge={erfolge} setErfolge={setErfolge} configVersion={configVersion} setConfigVersion={setConfigVersion} />}
      {view === "ziele" && (trainer.rolle === "leitung" || trainer.rolle === "admin") && <ZieleView trainer={ctx} produkte={produkte} verfuegbarkeit={verfuegbarkeit} ziele={ziele} setZiele={setZiele} erfolge={erfolge} beratungen={beratungen} />}
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
